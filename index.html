<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mad.bzh</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a}
.scene{position:fixed;inset:0;overflow:hidden;background:#05070a}
.background,.background img,.fx{position:absolute;inset:0;width:100%;height:100%}
.background img{object-fit:cover;object-position:center 42%;user-select:none;-webkit-user-drag:none;animation:breath 12s ease-in-out infinite}
.fx{pointer-events:none}

.atmosphere{z-index:2;background:radial-gradient(ellipse at 50% 43%,rgba(255,190,100,.15),rgba(255,145,55,.08) 28%,transparent 68%);mix-blend-mode:screen;animation:pulse 6s ease-in-out infinite}
.glow{z-index:3;left:50%;top:45%;width:55vw;height:55vw;max-width:850px;max-height:850px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,190,85,.18),rgba(255,150,50,.10) 28%,rgba(255,120,30,.04) 48%,transparent 75%);mix-blend-mode:screen;animation:glow 8s ease-in-out infinite}
.sun{z-index:4;left:auto;right:8%;top:42%;width:280px;height:280px;transform:translate(50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,245,190,.28),rgba(255,190,75,.20) 18%,rgba(255,135,35,.10) 38%,transparent 72%);mix-blend-mode:screen;filter:blur(4px);animation:sun 5s ease-in-out infinite}
.sea{z-index:6;left:-15%;top:auto;bottom:0;width:130%;height:48%;background:repeating-linear-gradient(168deg,transparent 0%,transparent 5%,rgba(255,230,170,.10) 7%,rgba(255,210,130,.22) 8%,rgba(255,235,180,.08) 10%,transparent 14%);opacity:.72;mix-blend-mode:screen;animation:sea 6s ease-in-out infinite}
.reflection{z-index:7;left:0;top:auto;bottom:0;height:40%;background:linear-gradient(90deg,transparent,rgba(255,180,70,.03) 25%,rgba(255,205,120,.16) 48%,rgba(255,175,65,.10) 62%,transparent);mix-blend-mode:screen;animation:reflection 7s ease-in-out infinite}
.horizon{z-index:8;left:12%;right:12%;top:67%;height:3px;background:linear-gradient(90deg,transparent,rgba(255,205,120,.12),rgba(255,230,170,.45),rgba(255,190,80,.18),transparent);filter:blur(2px);mix-blend-mode:screen;animation:horizon 5s ease-in-out infinite}
.lightning{z-index:12;opacity:0;background:linear-gradient(105deg,transparent 43%,rgba(255,255,255,.08) 46%,rgba(255,255,255,.75) 49%,rgba(255,255,255,.25) 51%,transparent 54%);mix-blend-mode:screen;animation:bolt 11s infinite}
.lightning:before{content:"";position:absolute;inset:0;background:linear-gradient(78deg,transparent 57%,rgba(255,255,255,.10) 60%,rgba(255,255,255,.8) 63%,rgba(255,255,255,.2) 65%,transparent 68%);animation:bolt2 17s infinite}
.lightning:after{content:"";position:absolute;top:3%;left:59%;width:5px;height:48%;background:linear-gradient(180deg,transparent,rgba(255,255,255,.95) 25%,rgba(255,255,255,.65) 55%,transparent);transform:rotate(7deg) skewX(-15deg);filter:blur(1px);animation:bolt3 23s infinite}
.birds{z-index:9}
.bird{position:absolute;width:34px;height:16px;opacity:0;animation:fly 18s linear infinite}
.bird:before,.bird:after{content:"";position:absolute;top:7px;width:18px;height:7px;border-top:3px solid rgba(15,15,15,.88);border-radius:80% 80% 0 0}
.bird:before{right:16px;transform:rotate(18deg) skewX(-15deg)}
.bird:after{left:16px;transform:rotate(-18deg) skewX(15deg)}
.bird:nth-child(1){top:20%;left:-5%;animation-delay:1s;animation-duration:20s}
.bird:nth-child(2){top:27%;left:-8%;animation-delay:7s;animation-duration:24s;transform:scale(1.15)}
.bird:nth-child(3){top:15%;left:-12%;animation-delay:12s;animation-duration:22s;transform:scale(.55)}
.bird:nth-child(4){top:31%;left:-10%;animation-delay:17s;animation-duration:26s;transform:scale(.7)}
.gold{z-index:11;left:-25%;top:31%;width:22%;height:34%;background:linear-gradient(90deg,transparent,rgba(255,205,105,.05),rgba(255,220,135,.26),rgba(255,245,190,.12),transparent);filter:blur(10px);mix-blend-mode:screen;transform:skewX(-12deg);animation:gold 9s ease-in-out infinite}
.ambient{z-index:10;background:radial-gradient(ellipse at 50% 48%,rgba(255,150,45,.07),transparent 58%);mix-blend-mode:screen;animation:pulse2 5s ease-in-out infinite}
.vignette{z-index:15;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.08) 70%,rgba(0,0,0,.40) 100%)}

/* La surprise : la lumière suit discrètement la souris. */
.cursor-glow{z-index:20;inset:auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,150,.16),rgba(255,170,70,.06) 35%,transparent 70%);filter:blur(4px);transform:translate(-50%,-50%);opacity:0;transition:opacity .5s ease;mix-blend-mode:screen}
.scene:hover .cursor-glow{opacity:1}

.music{position:absolute;right:18px;bottom:18px;z-index:30;padding:10px 17px;border:1px solid rgba(235,205,145,.75);border-radius:22px;background:rgba(10,10,10,.65);color:#f3e5c4;font:15px Georgia,"Times New Roman",serif;cursor:pointer;backdrop-filter:blur(5px);transition:.3s}
.music:hover,.music.active{background:rgba(55,35,15,.82);color:#fff4d8;border-color:rgba(255,220,155,.95);box-shadow:0 0 20px rgba(255,170,70,.25);transform:translateY(-1px)}

@keyframes breath{0%,100%{filter:brightness(.96) saturate(1.02) contrast(1.02)}50%{filter:brightness(1.04) saturate(1.08) contrast(1.05)}}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.98)}50%{opacity:.95;transform:scale(1.03)}}
@keyframes glow{0%,100%{opacity:.45;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
@keyframes sun{0%,100%{opacity:.55;transform:translate(50%,-50%) scale(.88)}50%{opacity:1;transform:translate(50%,-50%) scale(1.14)}}
@keyframes sea{0%,100%{transform:translateX(-4%) scaleY(.98);opacity:.45}50%{transform:translateX(4%) scaleY(1.05);opacity:1}}
@keyframes reflection{0%,100%{transform:translateX(-2%);opacity:.35}50%{transform:translateX(3%);opacity:.9}}
@keyframes horizon{0%,100%{opacity:.25;transform:scaleX(.88)}50%{opacity:1;transform:scaleX(1.04)}}
@keyframes bolt{0%,67%,100%{opacity:0}68%{opacity:.95}68.8%{opacity:.15}69.4%{opacity:.85}70.2%{opacity:.05}71%{opacity:.65}72.5%{opacity:0}}
@keyframes bolt2{0%,51%,100%{opacity:0}52%{opacity:.75}53.2%{opacity:.12}54%{opacity:.9}55.5%{opacity:0}}
@keyframes bolt3{0%,78%,100%{opacity:0}79%{opacity:.9}80%{opacity:.15}81%{opacity:.75}82.5%{opacity:0}}
@keyframes fly{0%{left:-12%;opacity:0;transform:translateY(0) scale(1)}8%{opacity:.8}45%{opacity:.85}85%{opacity:.7}100%{left:110%;opacity:0;transform:translateY(-35px) scale(1)}}
@keyframes gold{0%,15%{left:-25%;opacity:0}25%{opacity:.3}50%{left:48%;opacity:.85}65%{opacity:.25}80%,100%{left:115%;opacity:0}}
@keyframes pulse2{0%,100%{opacity:.35}50%{opacity:.9}}

@media(max-width:700px){.music{right:12px;bottom:12px;padding:9px 14px;font-size:14px}.sun{width:180px;height:180px}.cursor-glow{width:180px;height:180px}}
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="background"><img src="visuel.jpg" alt="Mad.BZH"></div>
  <div class="fx atmosphere"></div>
  <div class="fx glow"></div>
  <div class="fx sun"></div>
  <div class="fx sea"></div>
  <div class="fx reflection"></div>
  <div class="fx horizon"></div>
  <div class="fx lightning"></div>
  <div class="fx birds">
    <div class="bird"></div><div class="bird"></div><div class="bird"></div><div class="bird"></div>
  </div>
  <div class="fx gold"></div>
  <div class="fx ambient"></div>
  <div class="fx vignette"></div>
  <div class="fx cursor-glow" id="cursorGlow"></div>

  <audio id="music" preload="auto" loop>
    <source src="jig-voyage.mp3" type="audio/mpeg">
  </audio>
  <button id="musicButton" class="music" type="button">♫ Musique</button>
</div>

<script>
const scene=document.getElementById('scene');
const cursorGlow=document.getElementById('cursorGlow');
scene.addEventListener('mousemove',e=>{
  cursorGlow.style.left=e.clientX+'px';
  cursorGlow.style.top=e.clientY+'px';
});

const music=document.getElementById('music');
const button=document.getElementById('musicButton');
button.addEventListener('click',async()=>{
  if(music.paused){
    try{
      await music.play();
      button.textContent='♫ Musique ON';
      button.classList.add('active');
    }catch(e){}
  }else{
    music.pause();
    button.textContent='♫ Musique';
    button.classList.remove('active');
  }
});
</script>
</body>
</html>
