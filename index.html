<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MAD.BZH</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

body {
    font-family: Georgia, "Times New Roman", serif;
}

/* =========================
   SCÈNE PRINCIPALE
   ========================= */

.scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #05070a;
}

/* =========================
   IMAGE VISUELLE
   ========================= */

.background {
    position: absolute;
    inset: -5%;
    width: 110%;
    height: 110%;

    background: url("visuel.jpg") center center / cover no-repeat;

    animation: backgroundDrift 24s ease-in-out infinite alternate;

    filter:
        saturate(1.04)
        contrast(1.03)
        brightness(0.96);
}

/* Mouvement très lent de l'image */
@keyframes backgroundDrift {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.045);
    }
}

/* =========================
   ATMOSPHÈRE LUMINEUSE
   ========================= */

.atmosphere {
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(255, 190, 90, 0.10),
            transparent 42%
        ),
        linear-gradient(
            180deg,
            rgba(3, 9, 16, 0.05),
            rgba(3, 9, 16, 0.22)
        );

    mix-blend-mode: screen;

    animation: atmospherePulse 8s ease-in-out infinite alternate;
}

@keyframes atmospherePulse {
    from {
        opacity: 0.65;
    }

    to {
        opacity: 1;
    }
}

/* =========================
   VOILE SOMBRE DISCRET
   ========================= */

.vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0, 0, 0, 0.42) 100%
        );
}

/* =========================
   BOUTON MUSIQUE
   ========================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    padding: 10px 18px;

    border: 1px solid rgba(235, 205, 145, 0.75);
    border-radius: 22px;

    background: rgba(10, 10, 10, 0.62);

    color: #f3e5c4;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    backdrop-filter: blur(5px);

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease;

    z-index: 10;
}

.music-button:hover {
    background: rgba(35, 25, 15, 0.82);
    border-color: rgba(255, 225, 165, 1);
    color: #fff4d8;
}

.music-button:active {
    transform: scale(0.96);
}

.music-button.playing {
    background: rgba(45, 28, 12, 0.82);
    border-color: rgba(255, 190, 90, 0.95);
}

/* =========================
   PETIT EFFET DE LUEUR
   ========================= */

.glow {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 35vw;
    height: 35vw;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: radial-gradient(
        circle,
        rgba(255, 170, 70, 0.055),
        transparent 68%
    );

    pointer-events: none;

    animation: glowPulse 7s ease-in-out infinite alternate;
}

@keyframes glowPulse {
    from {
        opacity: 0.35;
        transform: translate(-50%, -50%) scale(0.92);
    }

    to {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.08);
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- IMAGE PRINCIPALE -->
    <div class="background"></div>

    <!-- EFFETS VISUELS -->
    <div class="atmosphere"></div>
    <div class="glow"></div>
    <div class="vignette"></div>

    <!-- MUSIQUE -->
    <audio id="music" preload="auto" loop>
        <source src="celtic-ambience.wav" type="audio/wav">
    </audio>

    <button id="musicButton" class="music-button">
        ♫ Musique
    </button>

</div>

<script>
const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {
            await music.play();

            musicButton.textContent = "♫ Musique ON";
            musicButton.classList.add("playing");

        } catch (error) {

            musicButton.textContent = "♫ Musique";
            musicButton.classList.remove("playing");

        }

    } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("playing");
    }
});
</script>

</body>
</html>
