<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mad.bzh</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

/* =========================
   SCÈNE PRINCIPALE
   ========================= */

.scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

/* =========================
   IMAGE PRINCIPALE
   ========================= */

.background {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    background: #05070a;
}

/*
   L'image entière reste visible.
   Elle n'est donc pas coupée en haut ou en bas.
*/

.background img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center 42%;

    user-select: none;
    -webkit-user-drag: none;

    animation: imageBreathing 12s ease-in-out infinite;
}

/* =========================
   EFFET LUMINEUX
   ========================= */

.atmosphere {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(255, 184, 90, 0.10),
            rgba(255, 140, 50, 0.035) 32%,
            transparent 65%
        );

    mix-blend-mode: screen;

    animation: atmospherePulse 7s ease-in-out infinite;
}

/* =========================
   VIGNETTE
   ========================= */

.vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0, 0, 0, 0.10) 72%,
            rgba(0, 0, 0, 0.38) 100%
        );
}

/* =========================
   LUMIÈRE LENTE
   ========================= */

.glow {
    position: absolute;

    width: 42vw;
    height: 42vw;

    max-width: 650px;
    max-height: 650px;

    left: 50%;
    top: 46%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(255, 170, 65, 0.11) 0%,
            rgba(255, 120, 35, 0.045) 35%,
            transparent 72%
        );

    mix-blend-mode: screen;

    animation: glowMove 9s ease-in-out infinite;
}

/* =========================
   BOUTON MUSIQUE
   ========================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    z-index: 20;

    padding: 10px 17px;

    border: 1px solid rgba(235, 205, 145, 0.75);
    border-radius: 22px;

    background: rgba(10, 10, 10, 0.65);

    color: #f3e5c4;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease,
        box-shadow 0.3s ease;
}

.music-button:hover {
    background: rgba(45, 30, 15, 0.82);

    color: #fff4d8;

    border-color: rgba(255, 220, 155, 0.95);

    box-shadow:
        0 0 18px rgba(255, 170, 70, 0.18);

    transform: translateY(-1px);
}

.music-button.active {
    background: rgba(70, 42, 18, 0.78);

    color: #ffe9bd;

    border-color: rgba(255, 190, 90, 0.95);

    box-shadow:
        0 0 20px rgba(255, 170, 65, 0.28);
}

/* =========================
   ANIMATIONS
   ========================= */

/*
   Très léger changement de luminosité.
   L'image elle-même ne se déplace pas,
   donc aucun risque de couper le haut ou le bas.
*/

@keyframes imageBreathing {

    0% {
        filter:
            brightness(0.96)
            saturate(1.02)
            contrast(1.02);
    }

    50% {
        filter:
            brightness(1.02)
            saturate(1.06)
            contrast(1.04);
    }

    100% {
        filter:
            brightness(0.96)
            saturate(1.02)
            contrast(1.02);
    }
}

@keyframes atmospherePulse {

    0% {
        opacity: 0.35;
        transform: scale(0.96);
    }

    50% {
        opacity: 0.85;
        transform: scale(1.04);
    }

    100% {
        opacity: 0.35;
        transform: scale(0.96);
    }
}

@keyframes glowMove {

    0% {
        opacity: 0.35;
        transform: translate(-50%, -50%) scale(0.92);
    }

    50% {
        opacity: 0.85;
        transform: translate(-48%, -52%) scale(1.08);
    }

    100% {
        opacity: 0.35;
        transform: translate(-50%, -50%) scale(0.92);
    }
}

/* =========================
   PETITS ÉCRANS
   ========================= */

@media (max-width: 700px) {

    .music-button {
        right: 12px;
        bottom: 12px;

        padding: 9px 14px;

        font-size: 14px;
    }

}
/* ==========================================
   EFFETS VISUELS - MER / LUEURS / ÉCLAIRS
   ========================================== */

/* --- LUEUR ATMOSPHÉRIQUE --- */

.ambient-glow {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 3;

    background:
        radial-gradient(
            ellipse at 78% 55%,
            rgba(255, 180, 70, 0.10),
            transparent 35%
        );

    animation: ambientPulse 8s ease-in-out infinite;
}

@keyframes ambientPulse {
    0%, 100% {
        opacity: 0.45;
    }

    50% {
        opacity: 0.85;
    }
}


/* --- LÉGER MIROITEMENT SUR LA MER --- */

.sea-shimmer {
    position: absolute;
    left: -10%;
    bottom: 0;
    width: 120%;
    height: 45%;

    pointer-events: none;
    z-index: 4;

    background:
        repeating-linear-gradient(
            170deg,
            transparent 0%,
            transparent 8%,
            rgba(255, 220, 160, 0.10) 10%,
            rgba(255, 220, 160, 0.03) 12%,
            transparent 15%
        );

    opacity: 0.55;

    mix-blend-mode: screen;

    animation: seaShimmer 8s ease-in-out infinite;
}

@keyframes seaShimmer {
    0% {
        transform: translateX(-3%);
        opacity: 0.35;
    }

    50% {
        transform: translateX(3%);
        opacity: 0.75;
    }

    100% {
        transform: translateX(-3%);
        opacity: 0.35;
    }
}

/* --- PETITES LUEURS SUR L'HORIZON --- */

.sea-shimmer::after {
    content: "";
    position: absolute;

    left: 15%;
    right: 15%;
    top: 42%;

    height: 2px;

    background: rgba(255, 210, 130, 0.22);

    filter: blur(2px);

    animation: horizonGlow 5s ease-in-out infinite;
}

@keyframes horizonGlow {
    0%, 100% {
        opacity: 0.15;
        transform: scaleX(0.85);
    }

    50% {
        opacity: 0.65;
        transform: scaleX(1);
    }
}


/* --- ÉCLAIRS TRÈS DISCRETS --- */

.lightning {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 5;

    opacity: 0;

    background:
        linear-gradient(
            110deg,
            transparent 0%,
            transparent 46%,
            rgba(255, 255, 255, 0.12) 49%,
            transparent 52%,
            transparent 100%
        );

    animation: distantLightning 13s infinite;
}

@keyframes distantLightning {

    0%, 88%, 100% {
        opacity: 0;
    }

    89% {
        opacity: 0.15;
    }

    89.4% {
        opacity: 0;
    }

    90% {
        opacity: 0.08;
    }

    90.4% {
        opacity: 0;
    }
}


/* --- PETIT ÉCLAIR SECONDAIRE --- */

.lightning::after {
    content: "";
    position: absolute;

    top: 5%;
    right: 27%;

    width: 2px;
    height: 30%;

    background: rgba(255, 255, 255, 0.55);

    transform: rotate(8deg);

    filter: blur(1px);

    opacity: 0;

    animation: lightningFlash 17s infinite;
}

@keyframes lightningFlash {

    0%, 91%, 100% {
        opacity: 0;
    }

    92% {
        opacity: 0.7;
    }

    92.2% {
        opacity: 0;
    }

    92.5% {
        opacity: 0.35;
    }

    92.8% {
        opacity: 0;
    }
}
</style>
</head>


<body>

<div class="scene">

    <!-- IMAGE PRINCIPALE -->
    <div class="background">
        <img src="visuel.jpg" alt="Mad.BZH">
    </div>

    <!-- EFFETS VISUELS -->
    <div class="atmosphere"></div>
    <div class="glow"></div>
    <div class="vignette"></div>
<div class="sea-shimmer"></div>
<div class="lightning"></div>
<div class="ambient-glow"></div>
    <!-- MUSIQUE -->
    <audio id="music" preload="auto" loop>
        <source src="celtic-ambience.wav" type="audio/wav">
    </audio>

    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Activer ou arrêter la musique"
    >
        ♫ Musique
    </button>

</div>


<script>

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {

            await music.play();

            musicButton.textContent = "♫ Musique ON";
            musicButton.classList.add("active");

        } catch (error) {

            console.log("Lecture audio impossible :", error);

        }

    } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("active");

    }

});

</script>

</body>
</html>
