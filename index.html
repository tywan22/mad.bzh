<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAD.BZH — Prochainement</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #05070a;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* =========================================
           SCÈNE PRINCIPALE
           ========================================= */

        .scene {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #05070a;
        }

        /* =========================================
           VISUEL PRINCIPAL
           ========================================= */

        .background {
            position: absolute;
            inset: -3%;

            background-image: url("visuel.jpg");
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;

            animation: backgroundBreath 18s ease-in-out infinite alternate;

            will-change: transform;
        }

        @keyframes backgroundBreath {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.035);
            }
        }

        /* =========================================
           EFFET LUMINEUX TRÈS DISCRET
           Aucun objet supplémentaire
           ========================================= */

        .atmosphere {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    circle at 72% 48%,
                    rgba(255, 170, 75, 0.10),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 28% 55%,
                    rgba(255, 190, 100, 0.045),
                    transparent 40%
                );

            mix-blend-mode: screen;

            animation: atmospherePulse 9s ease-in-out infinite alternate;
        }

        @keyframes atmospherePulse {
            from {
                opacity: 0.45;
            }

            to {
                opacity: 0.9;
            }
        }

        /* =========================================
           ASSOMBRISSEMENT TRÈS LÉGER DES BORDS
           ========================================= */

        .vignette {
            position: absolute;
            inset: 0;

            pointer-events: none;

            background:
                radial-gradient(
                    ellipse at center,
                    transparent 48%,
                    rgba(0, 0, 0, 0.16) 100%
                );
        }

        /* =========================================
           BOUTON MUSIQUE
           ========================================= */

        .music-button {
            position: absolute;

            right: 18px;
            bottom: 18px;

            z-index: 10;

            padding: 10px 18px;

            border: 1px solid rgba(235, 205, 145, 0.75);
            border-radius: 22px;

            background: rgba(10, 10, 10, 0.62);

            color: #f3e5c4;

            font-family: Georgia, "Times New Roman", serif;
            font-size: 15px;

            cursor: pointer;

            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            transition:
                background 0.3s ease,
                color 0.3s ease,
                border-color 0.3s ease,
                transform 0.2s ease;
        }

        .music-button:hover {
            background: rgba(40, 30, 18, 0.78);
            color: #fff4d8;
            border-color: rgba(255, 225, 165, 0.95);
            transform: translateY(-1px);
        }

        .music-button.playing {
            background: rgba(75, 45, 20, 0.78);
            color: #fff1ca;
            border-color: rgba(255, 210, 125, 0.95);
        }

        /* =========================================
           PETITS ÉCRANS
           ========================================= */

        @media (max-width: 700px) {

            .background {
                inset: -5%;
            }

            .music-button {
                right: 14px;
                bottom: 14px;
                padding: 9px 15px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="scene">

        <!-- IMAGE PRINCIPALE -->
        <div class="background"></div>

        <!-- EFFETS VISUELS DISCRETS -->
        <div class="atmosphere"></div>
        <div class="vignette"></div>

        <!-- MUSIQUE -->
        <audio id="music" preload="auto" loop>
            <source src="celtic-ambience.wav" type="audio/wav">
        </audio>

        <button
            id="musicButton"
            class="music-button"
            type="button"
            aria-label="Activer la musique"
        >
            ♫ Musique
        </button>

    </main>

    <script>
        const music = document.getElementById("music");
        const musicButton = document.getElementById("musicButton");

        musicButton.addEventListener("click", async () => {

            if (music.paused) {

                try {
                    await music.play();

                    musicButton.textContent = "♫ Musique ON";
                    musicButton.classList.add("playing");
                    musicButton.setAttribute(
                        "aria-label",
                        "Arrêter la musique"
                    );

                } catch (error) {

                    musicButton.textContent = "♫ Musique";
                    musicButton.classList.remove("playing");

                    console.error(
                        "Impossible de lire la musique :",
                        error
                    );
                }

            } else {

                music.pause();

                musicButton.textContent = "♫ Musique";
                musicButton.classList.remove("playing");

                musicButton.setAttribute(
                    "aria-label",
                    "Activer la musique"
                );
            }
        });
    </script>

</body>
</html>
