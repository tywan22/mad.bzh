<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mad.bzh</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

.scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}


/* =========================================================
   IMAGE PRINCIPALE
   ========================================================= */

.background {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    background: #05070a;
}

.background img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center 42%;

    user-select: none;
    -webkit-user-drag: none;

    animation: imageBreathing 12s ease-in-out infinite;
}


/* =========================================================
   ATMOSPHÈRE
   ========================================================= */

.atmosphere {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 2;

    background:
        radial-gradient(
            circle at 50% 43%,
            rgba(255, 190, 100, 0.16),
            rgba(255, 140, 45, 0.055) 35%,
            transparent 68%
        );

    mix-blend-mode: screen;

    animation: atmospherePulse 7s ease-in-out infinite;
}


/* =========================================================
   HALO CENTRAL
   ========================================================= */

.glow {
    position: absolute;

    width: 50vw;
    height: 50vw;

    max-width: 760px;
    max-height: 760px;

    left: 50%;
    top: 43%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;
    z-index: 3;

    background:
        radial-gradient(
            circle,
            rgba(255, 190, 80, 0.16) 0%,
            rgba(255, 145, 45, 0.07) 30%,
            rgba(255, 100, 20, 0.025) 48%,
            transparent 72%
        );

    mix-blend-mode: screen;

    animation: glowMove 9s ease-in-out infinite;
}


/* =========================================================
   LUMIÈRE DU SOLEIL
   ========================================================= */

.sun-glow {
    position: absolute;

    width: 38vw;
    height: 38vw;

    max-width: 600px;
    max-height: 600px;

    right: -3%;
    top: 27%;

    border-radius: 50%;

    pointer-events: none;
    z-index: 3;

    background:
        radial-gradient(
            circle,
            rgba(255, 230, 150, 0.20) 0%,
            rgba(255, 190, 80, 0.12) 18%,
            rgba(255, 140, 40, 0.055) 38%,
            transparent 70%
        );

    mix-blend-mode: screen;

    animation: sunPulse 6s ease-in-out infinite;
}


/* =========================================================
   VIGNETTE
   ========================================================= */

.vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 12;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0, 0, 0, 0.08) 68%,
            rgba(0, 0, 0, 0.42) 100%
        );
}


/* =========================================================
   REFLETS SUR LA MER
   ========================================================= */

.sea-shimmer {
    position: absolute;

    left: -12%;
    bottom: -2%;

    width: 124%;
    height: 48%;

    pointer-events: none;
    z-index: 5;

    background:
        repeating-linear-gradient(
            168deg,
            transparent 0%,
            transparent 5%,
            rgba(255, 225, 165, 0.05) 7%,
            rgba(255, 215, 140, 0.16) 9%,
            rgba(255, 235, 190, 0.08) 11%,
            transparent 14%
        );

    opacity: 0.72;

    mix-blend-mode: screen;

    animation: seaShimmer 6s ease-in-out infinite;
}


/* =========================================================
   REFLET HORIZONTAL DE L'HORIZON
   ========================================================= */

.horizon-light {
    position: absolute;

    left: 8%;
    right: 8%;
    top: 67%;

    height: 4px;

    pointer-events: none;
    z-index: 6;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 190, 90, 0.15),
            rgba(255, 230, 160, 0.65),
            rgba(255, 190, 90, 0.15),
            transparent
        );

    filter: blur(3px);

    mix-blend-mode: screen;

    animation: horizonPulse 5s ease-in-out infinite;
}


/* =========================================================
   REFLET DU SOLEIL SUR L'EAU
   ========================================================= */

.sun-reflection {
    position: absolute;

    right: 5%;
    bottom: 7%;

    width: 42%;
    height: 22%;

    pointer-events: none;
    z-index: 6;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255, 210, 120, 0.24),
            rgba(255, 170, 70, 0.10) 32%,
            transparent 70%
        );

    filter: blur(7px);

    mix-blend-mode: screen;

    animation: reflectionPulse 4.5s ease-in-out infinite;
}


/* =========================================================
   ÉCLAIRS
   ========================================================= */

.lightning {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 8;

    opacity: 0;

    background:
        linear-gradient(
            110deg,
            transparent 0%,
            transparent 40%,
            rgba(255, 255, 255, 0.03) 44%,
            rgba(255, 255, 255, 0.32) 48%,
            rgba(255, 255, 255, 0.12) 50%,
            transparent 55%,
            transparent 100%
        );

    mix-blend-mode: screen;

    animation: distantLightning 11s infinite;
}


/* éclair vertical */

.lightning::after {
    content: "";

    position: absolute;

    top: 4%;
    right: 25%;

    width: 4px;
    height: 38%;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255, 255, 255, 0.90),
            rgba(255, 245, 210, 0.45),
            transparent
        );

    filter: blur(1px);

    transform: rotate(8deg);

    opacity: 0;

    animation: lightningBolt 11s infinite;
}


/* deuxième éclair */

.lightning-second {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 7;

    opacity: 0;

    background:
        linear-gradient(
            75deg,
            transparent 0%,
            transparent 54%,
            rgba(255, 255, 255, 0.24) 57%,
            transparent 61%,
            transparent 100%
        );

    mix-blend-mode: screen;

    animation: secondLightning 17s infinite;
}


/* =========================================================
   BALAYAGE DORÉ SUR MAD BZH
   ========================================================= */

/*
   Le texte MAD.BZH est intégré à visuel.jpg.
   Ce balayage donne donc l'illusion d'une lumière
   qui court sur les caractères sans modifier l'image.
*/

.title-shine {
    position: absolute;

    left: 24%;
    top: 29%;

    width: 52%;
    height: 23%;

    pointer-events: none;
    z-index: 9;

    overflow: hidden;

    opacity: 0;

    mix-blend-mode: screen;

    animation: titleShine 10s ease-in-out infinite;
}

.title-shine::before {
    content: "";

    position: absolute;

    top: -30%;
    left: -25%;

    width: 18%;
    height: 160%;

    transform: skewX(-18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 220, 130, 0.12),
            rgba(255, 240, 180, 0.72),
            rgba(255, 205, 100, 0.24),
            transparent
        );

    filter: blur(3px);
}


/* deuxième passage plus fin */

.title-shine::after {
    content: "";

    position: absolute;

    top: 0;
    left: -20%;

    width: 9%;
    height: 100%;

    transform: skewX(-18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 245, 200, 0.80),
            transparent
        );

    filter: blur(2px);
}


/* =========================================================
   LUEUR BASSE
   ========================================================= */

.lower-glow {
    position: absolute;

    left: 25%;
    right: 25%;
    bottom: 11%;

    height: 13%;

    pointer-events: none;
    z-index: 5;

    background:
        radial-gradient(
            ellipse at center,
            rgba(255, 180, 70, 0.16),
            transparent 70%
        );

    filter: blur(8px);

    mix-blend-mode: screen;

    animation: lowerGlow 7s ease-in-out infinite;
}


/* =========================================================
   BOUTON MUSIQUE
   ========================================================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    z-index: 30;

    padding: 10px 17px;

    border: 1px solid rgba(235, 205, 145, 0.75);
    border-radius: 22px;

    background: rgba(10, 10, 10, 0.65);

    color: #f3e5c4;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease,
        box-shadow 0.3s ease;
}

.music-button:hover {
    background: rgba(45, 30, 15, 0.82);

    color: #fff4d8;

    border-color: rgba(255, 220, 155, 0.95);

    box-shadow:
        0 0 18px rgba(255, 170, 70, 0.18);

    transform: translateY(-1px);
}

.music-button.active {
    background: rgba(70, 42, 18, 0.78);

    color: #ffe9bd;

    border-color: rgba(255, 190, 90, 0.95);

    box-shadow:
        0 0 20px rgba(255, 170, 65, 0.28);
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes imageBreathing {

    0%, 100% {
        filter:
            brightness(0.96)
            saturate(1.04)
            contrast(1.03);
    }

    50% {
        filter:
            brightness(1.04)
            saturate(1.10)
            contrast(1.05);
    }
}


@keyframes atmospherePulse {

    0%, 100% {
        opacity: 0.40;
        transform: scale(0.97);
    }

    50% {
        opacity: 0.90;
        transform: scale(1.04);
    }
}


@keyframes glowMove {

    0%, 100% {
        opacity: 0.35;
        transform: translate(-50%, -50%) scale(0.93);
    }

    50% {
        opacity: 0.90;
        transform: translate(-48%, -51%) scale(1.08);
    }
}


@keyframes sunPulse {

    0%, 100% {
        opacity: 0.35;
        transform: scale(0.94);
    }

    50% {
        opacity: 0.95;
        transform: scale(1.08);
    }
}


@keyframes seaShimmer {

    0%, 100% {
        transform: translateX(-3%);
        opacity: 0.40;
    }

    50% {
        transform: translateX(3%);
        opacity: 0.95;
    }
}


@keyframes horizonPulse {

    0%, 100% {
        opacity: 0.20;
        transform: scaleX(0.82);
    }

    50% {
        opacity: 0.95;
        transform: scaleX(1.08);
    }
}


@keyframes reflectionPulse {

    0%, 100% {
        opacity: 0.30;
        transform: scaleX(0.90);
    }

    50% {
        opacity: 1;
        transform: scaleX(1.08);
    }
}


/* =========================================================
   ÉCLAIRS — PLUS VISIBLES
   ========================================================= */

@keyframes distantLightning {

    0%, 54%, 100% {
        opacity: 0;
    }

    55% {
        opacity: 0.65;
    }

    55.8% {
        opacity: 0.05;
    }

    56.5% {
        opacity: 0.90;
    }

    57.5% {
        opacity: 0.18;
    }

    59% {
        opacity: 0.50;
    }

    60.5% {
        opacity: 0;
    }
}


@keyframes lightningBolt {

    0%, 57%, 100% {
        opacity: 0;
    }

    57.1% {
        opacity: 0.85;
    }

    57.8% {
        opacity: 0.15;
    }

    58.5% {
        opacity: 1;
    }

    59.2% {
        opacity: 0.35;
    }

    60% {
        opacity: 0;
    }
}


@keyframes secondLightning {

    0%, 68%, 100% {
        opacity: 0;
    }

    69% {
        opacity: 0.65;
    }

    70% {
        opacity: 0.10;
    }

    71% {
        opacity: 0.75;
    }

    72.5% {
        opacity: 0.15;
    }

    74% {
        opacity: 0;
    }
}


/* =========================================================
   BALAYAGE SUR LE TITRE
   ========================================================= */

@keyframes titleShine {

    0% {
        opacity: 0;
    }

    10% {
        opacity: 0;
    }

    18% {
        opacity: 0.95;
    }

    35% {
        opacity: 0.95;
    }

    48% {
        opacity: 0;
    }

    68% {
        opacity: 0;
    }

    76% {
        opacity: 0.75;
    }

    88% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


@keyframes lowerGlow {

    0%, 100% {
        opacity: 0.25;
        transform: scaleX(0.90);
    }

    50% {
        opacity: 0.85;
        transform: scaleX(1.08);
    }
}


/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media (max-width: 700px) {

    .music-button {
        right: 12px;
        bottom: 12px;

        padding: 9px 14px;

        font-size: 14px;
    }

    .title-shine {
        left: 17%;
        width: 66%;
    }

}

</style>
</head>


<body>

<div class="scene">

    <!-- IMAGE ORIGINALE : NE PAS CHANGER -->
    <div class="background">
        <img src="visuel.jpg" alt="Mad.BZH">
    </div>


    <!-- ATMOSPHÈRE -->
    <div class="atmosphere"></div>

    <!-- HALO CENTRAL -->
    <div class="glow"></div>

    <!-- LUMIÈRE DU SOLEIL -->
    <div class="sun-glow"></div>

    <!-- REFLETS MER -->
    <div class="sea-shimmer"></div>
    <div class="horizon-light"></div>
    <div class="sun-reflection"></div>

    <!-- ÉCLAIRS -->
    <div class="lightning"></div>
    <div class="lightning-second"></div>

    <!-- LUMIÈRE SUR MAD BZH -->
    <div class="title-shine"></div>

    <!-- LUEUR BASSE -->
    <div class="lower-glow"></div>

    <!-- VIGNETTE -->
    <div class="vignette"></div>


    <!-- MUSIQUE -->
    <audio id="music" preload="auto" loop>
        <source src="celtic-ambience.wav" type="audio/wav">
    </audio>

    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Activer ou arrêter la musique"
    >
        ♫ Musique
    </button>

</div>


<script>

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {

            await music.play();

            musicButton.textContent = "♫ Musique ON";
            musicButton.classList.add("active");

        } catch (error) {

            console.log("Lecture audio impossible :", error);

        }

    } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("active");

    }

});

</script>

</body>
</html>
