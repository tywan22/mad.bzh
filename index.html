<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mad.bzh</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

/* =========================================================
   SCÈNE
   ========================================================= */

.scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

/* =========================================================
   IMAGE PRINCIPALE
   ========================================================= */

.background {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    background: #05070a;
}

.background img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center 42%;

    user-select: none;
    -webkit-user-drag: none;

    animation: imageBreathing 12s ease-in-out infinite;
}

/* =========================================================
   ATMOSPHÈRE CHAUDE
   ========================================================= */

.atmosphere {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse 55% 45% at 75% 48%,
            rgba(255, 175, 65, 0.16) 0%,
            rgba(255, 125, 35, 0.08) 30%,
            transparent 70%
        );

    mix-blend-mode: screen;

    opacity: 0.65;

    animation: atmospherePulse 7s ease-in-out infinite;
}

/* =========================================================
   GRAND HALO CENTRAL
   ========================================================= */

.glow {
    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 850px;
    max-height: 850px;

    left: 50%;
    top: 48%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(255, 190, 80, 0.14) 0%,
            rgba(255, 135, 40, 0.075) 28%,
            rgba(255, 100, 25, 0.025) 48%,
            transparent 72%
        );

    mix-blend-mode: screen;

    opacity: 0.75;

    animation: glowMove 9s ease-in-out infinite;
}

/* =========================================================
   LUEUR DU COUCHER DE SOLEIL
   ========================================================= */

.sun-glow {
    position: absolute;
    right: 5%;
    top: 28%;

    width: 38vw;
    height: 38vw;

    max-width: 650px;
    max-height: 650px;

    border-radius: 50%;

    pointer-events: none;

    background:
        radial-gradient(
            circle,
            rgba(255, 205, 105, 0.18) 0%,
            rgba(255, 150, 45, 0.08) 30%,
            transparent 68%
        );

    mix-blend-mode: screen;

    animation: sunGlow 6s ease-in-out infinite;
}

/* =========================================================
   VIGNETTE
   ========================================================= */

.vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0, 0, 0, 0.08) 70%,
            rgba(0, 0, 0, 0.42) 100%
        );
}

/* =========================================================
   REFLETS SUR LA MER
   ========================================================= */

.sea-shimmer {
    position: absolute;

    left: -15%;
    bottom: 0;

    width: 130%;
    height: 48%;

    pointer-events: none;

    z-index: 6;

    background:
        repeating-linear-gradient(
            168deg,
            transparent 0%,
            transparent 5%,
            rgba(255, 220, 150, 0.025) 6%,
            rgba(255, 225, 165, 0.16) 8%,
            rgba(255, 190, 100, 0.06) 10%,
            transparent 13%,
            transparent 18%
        );

    opacity: 0.75;

    mix-blend-mode: screen;

    animation:
        seaShimmer 5s ease-in-out infinite,
        seaDrift 13s linear infinite;
}

/* Deuxième couche de reflets */

.sea-shimmer::before {
    content: "";

    position: absolute;

    left: 0;
    bottom: 5%;

    width: 100%;
    height: 65%;

    background:
        repeating-linear-gradient(
            175deg,
            transparent 0%,
            transparent 7%,
            rgba(255, 235, 180, 0.10) 9%,
            transparent 12%,
            transparent 19%
        );

    opacity: 0.75;

    mix-blend-mode: screen;

    animation: seaWaves 6s ease-in-out infinite;
}

/* Bande lumineuse de l'horizon */

.sea-shimmer::after {
    content: "";

    position: absolute;

    left: 22%;
    right: 12%;
    top: 22%;

    height: 5px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 190, 95, 0.18),
            rgba(255, 235, 175, 0.75),
            rgba(255, 180, 75, 0.18),
            transparent
        );

    filter: blur(4px);

    opacity: 0.8;

    animation: horizonGlow 4s ease-in-out infinite;
}

/* =========================================================
   REFLET VERTICAL DU SOLEIL SUR L'EAU
   ========================================================= */

.water-light {
    position: absolute;

    right: 12%;
    bottom: -4%;

    width: 22%;
    height: 45%;

    pointer-events: none;

    z-index: 7;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(255, 220, 130, 0.04) 12%,
            rgba(255, 205, 105, 0.22) 35%,
            rgba(255, 170, 60, 0.13) 60%,
            transparent 100%
        );

    filter: blur(7px);

    mix-blend-mode: screen;

    transform: skewX(-8deg);

    animation: waterLight 5s ease-in-out infinite;
}

/* =========================================================
   ÉCLAIRS
   ========================================================= */

.lightning {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 12;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at 72% 24%,
            rgba(255, 245, 215, 0.32),
            rgba(255, 220, 170, 0.10) 18%,
            transparent 42%
        );

    mix-blend-mode: screen;

    animation: distantLightning 11s infinite;
}

/*
   Éclair principal.
   Il est volontairement assez visible pour être remarqué,
   mais très bref pour conserver un aspect naturel.
*/

.lightning::before {
    content: "";

    position: absolute;

    top: 5%;
    right: 25%;

    width: 5px;
    height: 42%;

    background:
        linear-gradient(
            to bottom,
            transparent 0%,
            rgba(255,255,255,0.9) 8%,
            rgba(255,245,210,1) 42%,
            rgba(255,255,255,0.8) 72%,
            transparent 100%
        );

    clip-path: polygon(
        55% 0%,
        100% 0%,
        63% 35%,
        100% 35%,
        22% 100%,
        38% 53%,
        0% 53%
    );

    filter:
        blur(0.6px)
        drop-shadow(0 0 7px rgba(255,255,255,0.9))
        drop-shadow(0 0 20px rgba(255,220,150,0.7));

    transform: rotate(5deg);

    opacity: 0;

    animation: lightningStrike 11s infinite;
}

/* Éclair secondaire */

.lightning::after {
    content: "";

    position: absolute;

    top: 11%;
    right: 38%;

    width: 3px;
    height: 25%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,0.85),
            transparent
        );

    clip-path: polygon(
        40% 0%,
        100% 0%,
        60% 45%,
        100% 45%,
        20% 100%,
        35% 60%,
        0% 60%
    );

    filter:
        drop-shadow(0 0 8px rgba(255,255,255,0.9));

    opacity: 0;

    animation: lightningSecondary 17s infinite;
}

/* =========================================================
   FLASH D'ÉCLAIR DANS LE CIEL
   ========================================================= */

.sky-flash {
    position: absolute;
    inset: 0;

    pointer-events: none;

    z-index: 11;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at 70% 22%,
            rgba(255, 235, 200, 0.22),
            transparent 48%
        );

    mix-blend-mode: screen;

    animation: skyFlash 11s infinite;
}

/* =========================================================
   PARTICULES / PETITES LUEURS
   ========================================================= */

.sparkle {
    position: absolute;

    width: 3px;
    height: 3px;

    border-radius: 50%;

    pointer-events: none;

    z-index: 13;

    background: rgba(255, 225, 160, 0.9);

    box-shadow:
        0 0 8px rgba(255, 205, 120, 0.8),
        0 0 18px rgba(255, 180, 70, 0.5);

    opacity: 0;

    animation: sparkle 6s ease-in-out infinite;
}

.sparkle.one {
    left: 31%;
    top: 42%;
    animation-delay: 1s;
}

.sparkle.two {
    left: 63%;
    top: 51%;
    animation-delay: 3s;
}

.sparkle.three {
    left: 77%;
    top: 63%;
    animation-delay: 4.5s;
}

.sparkle.four {
    left: 43%;
    top: 67%;
    animation-delay: 2s;
}

/* =========================================================
   BOUTON MUSIQUE
   ========================================================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    z-index: 30;

    padding: 10px 17px;

    border: 1px solid rgba(235, 205, 145, 0.75);
    border-radius: 22px;

    background: rgba(10, 10, 10, 0.65);

    color: #f3e5c4;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease,
        box-shadow 0.3s ease;
}

.music-button:hover {
    background: rgba(45, 30, 15, 0.82);

    color: #fff4d8;

    border-color: rgba(255, 220, 155, 0.95);

    box-shadow:
        0 0 18px rgba(255, 170, 70, 0.18);

    transform: translateY(-1px);
}

.music-button.active {
    background: rgba(70, 42, 18, 0.78);

    color: #ffe9bd;

    border-color: rgba(255, 190, 90, 0.95);

    box-shadow:
        0 0 20px rgba(255, 170, 65, 0.28);
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes imageBreathing {

    0% {
        filter:
            brightness(0.96)
            saturate(1.02)
            contrast(1.02);
    }

    50% {
        filter:
            brightness(1.02)
            saturate(1.07)
            contrast(1.04);
    }

    100% {
        filter:
            brightness(0.96)
            saturate(1.02)
            contrast(1.02);
    }
}

@keyframes atmospherePulse {

    0%, 100% {
        opacity: 0.48;
        transform: scale(0.98);
    }

    50% {
        opacity: 0.82;
        transform: scale(1.04);
    }
}

@keyframes glowMove {

    0%, 100% {
        opacity: 0.42;
        transform: translate(-50%, -50%) scale(0.94);
    }

    50% {
        opacity: 0.82;
        transform: translate(-48%, -52%) scale(1.08);
    }
}

@keyframes sunGlow {

    0%, 100% {
        opacity: 0.35;
        transform: scale(0.95);
    }

    50% {
        opacity: 0.75;
        transform: scale(1.08);
    }
}

@keyframes seaShimmer {

    0% {
        transform: translateX(-3%);
        opacity: 0.35;
    }

    50% {
        transform: translateX(3%);
        opacity: 0.95;
    }

    100% {
        transform: translateX(-3%);
        opacity: 0.35;
    }
}

@keyframes seaDrift {

    0% {
        background-position: 0 0;
    }

    50% {
        background-position: 80px 20px;
    }

    100% {
        background-position: 160px 0;
    }
}

@keyframes seaWaves {

    0%, 100% {
        transform: translateX(-2%) scaleY(0.96);
        opacity: 0.35;
    }

    50% {
        transform: translateX(2%) scaleY(1.05);
        opacity: 0.9;
    }
}

@keyframes horizonGlow {

    0%, 100% {
        opacity: 0.18;
        transform: scaleX(0.8);
    }

    50% {
        opacity: 0.95;
        transform: scaleX(1.15);
    }
}

@keyframes waterLight {

    0%, 100% {
        opacity: 0.25;
        transform: skewX(-8deg) scaleY(0.92);
    }

    50% {
        opacity: 0.85;
        transform: skewX(-5deg) scaleY(1.08);
    }
}

/* =========================================================
   ÉCLAIRS : FLASHS COURTS ET VISIBLES
   ========================================================= */

@keyframes distantLightning {

    0%, 76%, 100% {
        opacity: 0;
    }

    78% {
        opacity: 0.22;
    }

    78.25% {
        opacity: 0.05;
    }

    78.6% {
        opacity: 0.48;
    }

    79% {
        opacity: 0;
    }

    81% {
        opacity: 0;
    }

    81.2% {
        opacity: 0.20;
    }

    81.45% {
        opacity: 0;
    }
}

@keyframes lightningStrike {

    0%, 76%, 100% {
        opacity: 0;
    }

    78% {
        opacity: 0.95;
    }

    78.18% {
        opacity: 0;
    }

    78.45% {
        opacity: 0.78;
    }

    78.75% {
        opacity: 0;
    }
}

@keyframes lightningSecondary {

    0%, 81%, 100% {
        opacity: 0;
    }

    82% {
        opacity: 0.8;
    }

    82.18% {
        opacity: 0;
    }

    82.5% {
        opacity: 0.45;
    }

    82.75% {
        opacity: 0;
    }
}

@keyframes skyFlash {

    0%, 76%, 100% {
        opacity: 0;
    }

    78% {
        opacity: 0.65;
    }

    78.2% {
        opacity: 0;
    }

    78.55% {
        opacity: 0.38;
    }

    78.8% {
        opacity: 0;
    }
}

/* =========================================================
   PETITES LUEURS
   ========================================================= */

@keyframes sparkle {

    0%, 70%, 100% {
        opacity: 0;
        transform: scale(0.5);
    }

    75% {
        opacity: 0.8;
        transform: scale(1.3);
    }

    80% {
        opacity: 0.15;
        transform: scale(0.7);
    }
}

/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media (max-width: 700px) {

    .music-button {
        right: 12px;
        bottom: 12px;

        padding: 9px 14px;

        font-size: 14px;
    }

    .sea-shimmer {
        height: 45%;
    }

    .water-light {
        right: 10%;
        width: 28%;
    }
}

</style>
</head>

<body>

<div class="scene">

    <!-- =====================================================
         IMAGE ORIGINALE : NE PAS MODIFIER
         ===================================================== -->

    <div class="background">
        <img src="visuel.jpg" alt="Mad.BZH">
    </div>

    <!-- =====================================================
         EFFETS
         ===================================================== -->

    <div class="atmosphere"></div>

    <div class="glow"></div>

    <div class="sun-glow"></div>

    <div class="sea-shimmer"></div>

    <div class="water-light"></div>

    <div class="sky-flash"></div>

    <div class="lightning"></div>

    <div class="sparkle one"></div>
    <div class="sparkle two"></div>
    <div class="sparkle three"></div>
    <div class="sparkle four"></div>

    <div class="vignette"></div>

    <!-- =====================================================
         MUSIQUE
         ===================================================== -->

    <audio id="music" preload="auto" loop>
        <source src="celtic-ambience.wav" type="audio/wav">
    </audio>

    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Activer ou arrêter la musique"
    >
        ♫ Musique
    </button>

</div>

<script>

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {

            await music.play();

            musicButton.textContent = "♫ Musique ON";
            musicButton.classList.add("active");

        } catch (error) {

            console.log("Lecture audio impossible :", error);

        }

    } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("active");

    }

});

</script>

</body>
</html>
