<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MAD.BZH</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020810;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
    }

    /* IMAGE PRINCIPALE */
    .scene {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        #020810 url("mad-bzh.jpg.png") center center / cover no-repeat;
    }

    /* Assombrissement très léger pour donner de la profondeur */
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 35%,
          rgba(0, 5, 12, 0.18) 75%,
          rgba(0, 3, 8, 0.48) 100%
        );
      z-index: 2;
    }

    /* LUMIÈRE QUI SE DÉPLACE */
    .light {
      position: absolute;
      width: 45vw;
      height: 45vw;
      max-width: 650px;
      max-height: 650px;
      left: 50%;
      top: 48%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 3;

      background: radial-gradient(
        circle,
        rgba(255, 190, 100, 0.14) 0%,
        rgba(255, 150, 70, 0.06) 28%,
        transparent 70%
      );

      animation: lightMove 13s ease-in-out infinite alternate;
    }

    @keyframes lightMove {
      0% {
        transform: translate(-55%, -52%) scale(0.9);
        opacity: 0.55;
      }

      50% {
        transform: translate(-42%, -48%) scale(1.08);
        opacity: 0.85;
      }

      100% {
        transform: translate(-48%, -40%) scale(0.96);
        opacity: 0.6;
      }
    }

    /* REFLET LUMINEUX SUR LA MER */
    .sea-light {
      position: absolute;
      left: 49%;
      bottom: 7%;
      width: 38vw;
      height: 17vh;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 4;

      background: linear-gradient(
        to bottom,
        rgba(255, 190, 100, 0.00),
        rgba(255, 185, 95, 0.13),
        rgba(255, 220, 150, 0.03),
        transparent
      );

      filter: blur(7px);

      animation: seaReflection 7s ease-in-out infinite alternate;
    }

    @keyframes seaReflection {
      0% {
        opacity: 0.35;
        transform: translateX(-53%) scaleX(0.85);
      }

      50% {
        opacity: 0.8;
        transform: translateX(-47%) scaleX(1.12);
      }

      100% {
        opacity: 0.45;
        transform: translateX(-51%) scaleX(0.92);
      }
    }

    /* PETITES ONDES LUMINEUSES */
    .waves {
      position: absolute;
      left: 20%;
      right: 10%;
      bottom: 0;
      height: 34%;
      pointer-events: none;
      z-index: 5;
      opacity: 0.28;
      background:
        repeating-linear-gradient(
          176deg,
          transparent 0px,
          transparent 13px,
          rgba(255, 220, 160, 0.18) 14px,
          transparent 16px
        );
      mask-image: linear-gradient(to top, black, transparent);
      animation: wavesMove 9s ease-in-out infinite alternate;
    }

    @keyframes wavesMove {
      from {
        transform: translateX(-12px);
      }

      to {
        transform: translateX(15px);
      }
    }

    /* ÉCLAIR */
    .lightning {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      opacity: 0;
      background: rgba(220, 235, 255, 0.55);
    }

    .lightning.flash {
      animation: lightningFlash 0.65s ease-out;
    }

    @keyframes lightningFlash {
      0%   { opacity: 0; }
      8%   { opacity: 0.72; }
      12%  { opacity: 0.05; }
      20%  { opacity: 0.48; }
      27%  { opacity: 0; }
      100% { opacity: 0; }
    }

    /* HALO AUTOUR DU SYMBOLE EN BAS À GAUCHE */
    .halo {
      position: absolute;
      left: 12%;
      bottom: 8%;
      width: 105px;
      height: 105px;
      transform: translate(-50%, 50%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 15;

      background: radial-gradient(
        circle,
        rgba(255, 180, 80, 0.65) 0%,
        rgba(255, 150, 60, 0.24) 18%,
        rgba(255, 120, 40, 0.08) 42%,
        transparent 70%
      );

      filter: blur(4px);
      opacity: 0;

      animation: haloPulse 12s ease-in-out infinite;
    }

    @keyframes haloPulse {
      0%, 58%, 100% {
        opacity: 0;
        transform: translate(-50%, 50%) scale(0.65);
      }

      62% {
        opacity: 0.9;
        transform: translate(-50%, 50%) scale(1.1);
      }

      67% {
        opacity: 0.35;
        transform: translate(-50%, 50%) scale(1.35);
      }

      72% {
        opacity: 0;
        transform: translate(-50%, 50%) scale(1.5);
      }
    }

    /* BOUTON MUSIQUE */
    .music-button {
      position: absolute;
      right: 24px;
      bottom: 20px;
      z-index: 50;

      padding: 10px 17px;
      border-radius: 30px;

      border: 1px solid rgba(255, 220, 170, 0.55);
      background: rgba(4, 10, 17, 0.55);
      color: #f5ead8;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;

      cursor: pointer;

      backdrop-filter: blur(6px);

      transition:
        background 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }

    .music-button:hover {
      background: rgba(80, 45, 20, 0.65);
      box-shadow: 0 0 20px rgba(255, 180, 90, 0.28);
      transform: translateY(-2px);
    }

    .music-button.playing {
      box-shadow:
        0 0 10px rgba(255, 190, 100, 0.4),
        0 0 30px rgba(255, 150, 60, 0.2);
    }

    /* MESSAGE DISCRET */
    .sound-note {
      position: absolute;
      right: 25px;
      bottom: 62px;
      z-index: 50;

      color: rgba(255, 240, 220, 0.72);
      font-size: 11px;

      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none;
    }

    .sound-note.show {
      opacity: 1;
    }

    /* PETITS ÉCLAATS */
    .spark {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255, 220, 160, 0.9);
      box-shadow: 0 0 9px rgba(255, 190, 100, 0.9);
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      animation: spark 5s ease-in-out infinite;
    }

    .spark:nth-child(1) {
      left: 29%;
      top: 28%;
      animation-delay: 1s;
    }

    .spark:nth-child(2) {
      left: 71%;
      top: 31%;
      animation-delay: 3s;
    }

    .spark:nth-child(3) {
      left: 61%;
      top: 20%;
      animation-delay: 5s;
    }

    @keyframes spark {
      0%, 75%, 100% {
        opacity: 0;
        transform: scale(0.3);
      }

      82% {
        opacity: 1;
        transform: scale(1.3);
      }

      88% {
        opacity: 0;
        transform: scale(0.5);
      }
    }

    /* MOBILE */
    @media (max-width: 700px) {
      .scene {
        background-position: center center;
      }

      .music-button {
        right: 14px;
        bottom: 14px;
      }

      .halo {
        left: 13%;
        bottom: 10%;
        width: 75px;
        height: 75px;
      }

      .sea-light {
        width: 70vw;
      }
    }
  </style>
</head>

<body>

  <main class="scene">

    <!-- Lumière générale -->
    <div class="light"></div>

    <!-- Reflet sur la mer -->
    <div class="sea-light"></div>

    <!-- Animation des vagues -->
    <div class="waves"></div>

    <!-- Halo occasionnel -->
    <div class="halo"></div>

    <!-- Éclairs -->
    <div class="lightning" id="lightning"></div>

    <!-- Petits éclats lumineux -->
    <div class="spark"></div>
    <div class="spark"></div>
    <div class="spark"></div>

    <!-- Musique -->
    <audio id="music" loop preload="auto">
      <source src="celtic-ambience.wav" type="audio/wav">
    </audio>

    <button class="music-button" id="musicButton">
      ♫ Musique
    </button>

    <div class="sound-note" id="soundNote">
      Cliquez pour écouter
    </div>

  </main>

  <script>
    /* ============================
       MUSIQUE
       ============================ */

    const music = document.getElementById("music");
    const musicButton = document.getElementById("musicButton");
    const soundNote = document.getElementById("soundNote");

    musicButton.addEventListener("click", async () => {

      if (music.paused) {
        try {
          await music.play();

          musicButton.textContent = "♫ Musique ON";
          musicButton.classList.add("playing");

        } catch (error) {
          soundNote.classList.add("show");

          setTimeout(() => {
            soundNote.classList.remove("show");
          }, 2500);
        }

      } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("playing");
      }
    });


    /* ============================
       ÉCLAIRS OCCASIONNELS
       ============================ */

    const lightning = document.getElementById("lightning");

    function createLightning() {

      lightning.classList.remove("flash");

      /* Force le navigateur à recalculer l'animation */
      void lightning.offsetWidth;

      lightning.classList.add("flash");
    }

    function scheduleLightning() {

      /* délai aléatoire entre environ 25 et 55 secondes */
      const delay = 25000 + Math.random() * 30000;

      setTimeout(() => {

        createLightning();

        /* parfois un deuxième éclair très léger */
        if (Math.random() < 0.35) {
          setTimeout(createLightning, 350);
        }

        scheduleLightning();

      }, delay);
    }

    scheduleLightning();
  </script>

</body>
</html>
