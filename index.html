<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAD.BZH</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;

            background:
                radial-gradient(circle at center, #26313a 0%, #111820 55%, #080c10 100%);

            color: #f5f0e8;
            font-family: Georgia, "Times New Roman", serif;
            text-align: center;
        }

        .container {
            padding: 40px;
        }

        .symbol {
            font-size: 55px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        h1 {
            margin: 0;
            font-size: clamp(60px, 12vw, 130px);
            letter-spacing: 0.18em;
            font-weight: normal;
        }

        .line {
            width: 180px;
            height: 1px;
            margin: 30px auto;
            background: #d6b36a;
        }

        p {
            margin: 0;
            font-size: clamp(18px, 3vw, 26px);
            letter-spacing: 0.12em;
        }

        .small {
            margin-top: 25px;
            font-size: 14px;
            letter-spacing: 0.18em;
            opacity: 0.55;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="symbol">ᛉ</div>

        <h1>MAD.BZH</h1>

        <div class="line"></div>

        <p>PROCHAINEMENT</p>

        <div class="small">
            Un projet est en préparation...
        </div>

    </main>

</body>
</html>
