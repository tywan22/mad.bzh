<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mad.bzh</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

.scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}


/* =========================================================
   IMAGE PRINCIPALE
   ========================================================= */

.background {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    background: #05070a;
}

.background img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center 42%;

    user-select: none;
    -webkit-user-drag: none;

    animation: imageBreathing 12s ease-in-out infinite;
}


/* =========================================================
   ATMOSPHÈRE GÉNÉRALE
   ========================================================= */

.atmosphere {
    position: absolute;
    inset: -8%;

    pointer-events: none;
    z-index: 2;

    background:
        radial-gradient(
            ellipse at 50% 43%,
            rgba(255, 190, 95, 0.14) 0%,
            rgba(255, 145, 55, 0.075) 24%,
            rgba(255, 100, 30, 0.035) 45%,
            transparent 70%
        );

    mix-blend-mode: screen;

    animation: atmospherePulse 7s ease-in-out infinite;
}


/* =========================================================
   GRANDE LUEUR CENTRALE
   ========================================================= */

.glow {
    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 850px;
    max-height: 850px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;
    z-index: 3;

    background:
        radial-gradient(
            circle,
            rgba(255, 190, 90, 0.16) 0%,
            rgba(255, 145, 50, 0.09) 25%,
            rgba(255, 100, 30, 0.045) 48%,
            transparent 72%
        );

    mix-blend-mode: screen;

    animation: glowMove 9s ease-in-out infinite;
}


/* =========================================================
   LUEUR LARGE SANS COUPURE HORIZONTALE
   ========================================================= */

.ambient-glow {
    position: absolute;
    inset: -10%;

    pointer-events: none;
    z-index: 4;

    background:
        radial-gradient(
            ellipse at 50% 48%,
            rgba(255, 170, 70, 0.12) 0%,
            rgba(255, 120, 40, 0.065) 28%,
            transparent 68%
        ),
        radial-gradient(
            ellipse at 78% 53%,
            rgba(255, 205, 105, 0.15) 0%,
            rgba(255, 150, 55, 0.07) 22%,
            transparent 55%
        ),
        radial-gradient(
            ellipse at 20% 57%,
            rgba(255, 125, 45, 0.075) 0%,
            transparent 48%
        );

    mix-blend-mode: screen;

    animation: ambientPulse 8s ease-in-out infinite;
}


/* =========================================================
   HALO DU SOLEIL
   ========================================================= */

.sun-glow {
    position: absolute;

    width: 32vw;
    height: 32vw;

    max-width: 520px;
    max-height: 520px;

    right: 7%;
    top: 38%;

    transform: translate(50%, -50%);

    border-radius: 50%;

    pointer-events: none;
    z-index: 5;

    background:
        radial-gradient(
            circle,
            rgba(255, 245, 190, 0.20) 0%,
            rgba(255, 205, 105, 0.13) 15%,
            rgba(255, 155, 50, 0.075) 32%,
            rgba(255, 110, 30, 0.025) 52%,
            transparent 72%
        );

    mix-blend-mode: screen;

    filter: blur(2px);

    animation: sunPulse 6s ease-in-out infinite;
}


/* =========================================================
   REFLETS SUR LA MER
   ========================================================= */

.sea-shimmer {
    position: absolute;

    left: -12%;
    bottom: -4%;

    width: 124%;
    height: 52%;

    pointer-events: none;
    z-index: 6;

    background:
        repeating-linear-gradient(
            168deg,
            transparent 0%,
            transparent 5%,
            rgba(255, 220, 155, 0.00) 7%,
            rgba(255, 225, 170, 0.13) 9%,
            rgba(255, 205, 135, 0.07) 11%,
            transparent 14%
        ),
        linear-gradient(
            180deg,
            transparent 0%,
            rgba(255, 185, 85, 0.025) 45%,
            rgba(255, 190, 90, 0.08) 75%,
            rgba(255, 205, 120, 0.11) 100%
        );

    opacity: 0.75;

    mix-blend-mode: screen;

    animation: seaShimmer 7s ease-in-out infinite;
}


/* Reflet lumineux plus concentré vers le soleil */

.sea-shimmer::before {
    content: "";

    position: absolute;

    left: 58%;
    top: 20%;

    width: 38%;
    height: 70%;

    background:
        repeating-linear-gradient(
            170deg,
            transparent 0%,
            rgba(255, 220, 150, 0.03) 8%,
            rgba(255, 225, 160, 0.17) 10%,
            transparent 14%
        );

    filter: blur(1px);

    opacity: 0.8;

    animation: waterReflection 5s ease-in-out infinite;
}


/* Ligne lumineuse de l'horizon */

.sea-shimmer::after {
    content: "";

    position: absolute;

    left: 12%;
    right: 12%;
    top: 36%;

    height: 3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 210, 130, 0.10) 20%,
            rgba(255, 225, 165, 0.40) 50%,
            rgba(255, 210, 130, 0.10) 80%,
            transparent
        );

    filter: blur(2px);

    animation: horizonGlow 4s ease-in-out infinite;
}


/* =========================================================
   ÉCLAIRS
   ========================================================= */

.lightning {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 12;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at 67% 25%,
            rgba(255, 255, 255, 0.18),
            transparent 28%
        ),
        linear-gradient(
            108deg,
            transparent 0%,
            transparent 42%,
            rgba(255, 255, 255, 0.00) 45%,
            rgba(255, 255, 245, 0.65) 48%,
            rgba(255, 255, 255, 0.12) 50%,
            transparent 54%,
            transparent 100%
        );

    mix-blend-mode: screen;

    animation: distantLightning 11s infinite;
}


/* Deuxième éclair */

.lightning::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            112deg,
            transparent 0%,
            transparent 54%,
            rgba(255, 255, 255, 0.00) 57%,
            rgba(255, 255, 255, 0.55) 59%,
            rgba(255, 255, 255, 0.10) 61%,
            transparent 64%,
            transparent 100%
        );

    opacity: 0;

    animation: secondLightning 17s infinite;
}


/* Éclair vertical secondaire */

.lightning::after {
    content: "";

    position: absolute;

    top: 4%;
    right: 28%;

    width: 4px;
    height: 38%;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255, 255, 255, 0.9) 20%,
            rgba(255, 255, 255, 0.35) 55%,
            transparent
        );

    transform: rotate(7deg);

    filter: blur(1px);

    opacity: 0;

    animation: lightningFlash 19s infinite;
}


/* =========================================================
   OISEAUX
   ========================================================= */

.birds {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 11;
}

.bird {
    position: absolute;

    width: 34px;
    height: 18px;

    opacity: 0.72;

    animation: birdFlight 14s linear infinite;
}

.bird::before,
.bird::after {
    content: "";

    position: absolute;

    top: 7px;

    width: 18px;
    height: 10px;

    border-top: 2px solid rgba(5, 7, 10, 0.88);

    border-radius: 50% 50% 0 0;
}

.bird::before {
    right: 50%;

    transform: rotate(14deg);
}

.bird::after {
    left: 50%;

    transform: rotate(-14deg);
}

.bird:nth-child(1) {
    top: 22%;
    left: 71%;
    transform: scale(0.85);
    animation-duration: 18s;
}

.bird:nth-child(2) {
    top: 28%;
    left: 80%;
    transform: scale(1.15);
    animation-duration: 22s;
    animation-delay: -7s;
}

.bird:nth-child(3) {
    top: 18%;
    left: 62%;
    transform: scale(0.65);
    animation-duration: 16s;
    animation-delay: -4s;
}

.bird:nth-child(4) {
    top: 34%;
    left: 74%;
    transform: scale(0.55);
    animation-duration: 20s;
    animation-delay: -11s;
}


/* =========================================================
   VIGNETTE
   ========================================================= */

.vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 15;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0, 0, 0, 0.08) 70%,
            rgba(0, 0, 0, 0.38) 100%
        );
}


/* =========================================================
   BOUTON MUSIQUE
   ========================================================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    z-index: 30;

    padding: 10px 17px;

    border: 1px solid rgba(235, 205, 145, 0.75);
    border-radius: 22px;

    background: rgba(10, 10, 10, 0.65);

    color: #f3e5c4;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease,
        box-shadow 0.3s ease;
}

.music-button:hover {
    background: rgba(45, 30, 15, 0.82);

    color: #fff4d8;

    border-color: rgba(255, 220, 155, 0.95);

    box-shadow:
        0 0 18px rgba(255, 170, 70, 0.18);

    transform: translateY(-1px);
}

.music-button.active {
    background: rgba(70, 42, 18, 0.78);

    color: #ffe9bd;

    border-color: rgba(255, 190, 90, 0.95);

    box-shadow:
        0 0 20px rgba(255, 170, 65, 0.28);
}


/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes imageBreathing {

    0%, 100% {
        filter:
            brightness(0.96)
            saturate(1.02)
            contrast(1.02);
    }

    50% {
        filter:
            brightness(1.04)
            saturate(1.08)
            contrast(1.05);
    }
}


@keyframes atmospherePulse {

    0%, 100% {
        opacity: 0.55;
        transform: scale(0.98);
    }

    50% {
        opacity: 1;
        transform: scale(1.03);
    }
}


@keyframes glowMove {

    0%, 100% {
        opacity: 0.45;
        transform: translate(-50%, -50%) scale(0.94);
    }

    50% {
        opacity: 0.95;
        transform: translate(-48%, -51%) scale(1.08);
    }
}


@keyframes ambientPulse {

    0%, 100% {
        opacity: 0.48;
        transform: scale(0.98);
    }

    50% {
        opacity: 0.95;
        transform: scale(1.025);
    }
}


@keyframes sunPulse {

    0%, 100% {
        opacity: 0.48;
        transform: translate(50%, -50%) scale(0.92);
    }

    50% {
        opacity: 1;
        transform: translate(50%, -50%) scale(1.12);
    }
}


@keyframes seaShimmer {

    0% {
        transform: translateX(-3%) scaleY(0.98);
        opacity: 0.42;
    }

    50% {
        transform: translateX(3%) scaleY(1.03);
        opacity: 0.90;
    }

    100% {
        transform: translateX(-3%) scaleY(0.98);
        opacity: 0.42;
    }
}


@keyframes waterReflection {

    0%, 100% {
        transform: translateX(-4%) scaleX(0.92);
        opacity: 0.35;
    }

    50% {
        transform: translateX(4%) scaleX(1.08);
        opacity: 0.95;
    }
}


@keyframes horizonGlow {

    0%, 100% {
        opacity: 0.18;
        transform: scaleX(0.82);
    }

    50% {
        opacity: 0.85;
        transform: scaleX(1.05);
    }
}


/* ÉCLAIR PRINCIPAL : plusieurs flashes prolongés */

@keyframes distantLightning {

    0%, 63% {
        opacity: 0;
    }

    64% {
        opacity: 0.28;
    }

    64.8% {
        opacity: 0.92;
    }

    66% {
        opacity: 0.18;
    }

    67% {
        opacity: 0.72;
    }

    68.5% {
        opacity: 0.10;
    }

    70% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


@keyframes secondLightning {

    0%, 71% {
        opacity: 0;
    }

    72% {
        opacity: 0.65;
    }

    73.5% {
        opacity: 0.12;
    }

    74.5% {
        opacity: 0.55;
    }

    76% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


@keyframes lightningFlash {

    0%, 78% {
        opacity: 0;
    }

    79% {
        opacity: 0.75;
    }

    80.2% {
        opacity: 0.20;
    }

    81% {
        opacity: 0.60;
    }

    82.2% {
        opacity: 0;
    }

    100% {
        opacity: 0;
    }
}


/* Mouvement des oiseaux */

@keyframes birdFlight {

    0% {
        margin-left: -15px;
        transform: translateY(0) scale(1);
    }

    25% {
        margin-left: 10px;
        transform: translateY(-8px) scale(1.02);
    }

    50% {
        margin-left: 30px;
        transform: translateY(2px) scale(0.98);
    }

    75% {
        margin-left: 55px;
        transform: translateY(-7px) scale(1.02);
    }

    100% {
        margin-left: 90px;
        transform: translateY(0) scale(1);
    }
}


/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media (max-width: 700px) {

    .music-button {
        right: 12px;
        bottom: 12px;

        padding: 9px 14px;

        font-size: 14px;
    }

    .sun-glow {
        width: 45vw;
        height: 45vw;
    }

    .sea-shimmer {
        height: 48%;
    }
}

</style>
</head>


<body>

<div class="scene">

    <!-- IMAGE ORIGINALE : VISUEL.JPG -->
    <div class="background">
        <img src="visuel.jpg" alt="Mad.BZH">
    </div>


    <!-- ATMOSPHÈRE -->
    <div class="atmosphere"></div>

    <div class="glow"></div>

    <div class="ambient-glow"></div>

    <!-- LUMIÈRE DU SOLEIL -->
    <div class="sun-glow"></div>

    <!-- REFLETS MER -->
    <div class="sea-shimmer"></div>

    <!-- ÉCLAIRS -->
    <div class="lightning"></div>

    <!-- OISEAUX -->
    <div class="birds">
        <div class="bird"></div>
        <div class="bird"></div>
        <div class="bird"></div>
        <div class="bird"></div>
    </div>

    <!-- VIGNETTE -->
    <div class="vignette"></div>


    <!-- MUSIQUE -->
    <audio id="music" preload="auto" loop>
        <source src="celtic-ambience.wav" type="audio/wav">
    </audio>


    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Activer ou arrêter la musique"
    >
        ♫ Musique
    </button>

</div>


<script>

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {

            await music.play();

            musicButton.textContent = "♫ Musique ON";
            musicButton.classList.add("active");

        } catch (error) {

            console.log("Lecture audio impossible :", error);

        }

    } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("active");

    }

});

</script>

</body>
</html>
