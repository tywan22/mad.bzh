<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mad.bzh</title>

<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

.scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

/* =========================================================
   IMAGE PRINCIPALE
   ========================================================= */

.background {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 100%;
    height: 100%;

    background: #05070a;
}

.background img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center 42%;

    user-select: none;
    -webkit-user-drag: none;

    animation: imageBreathing 12s ease-in-out infinite;
}

/* =========================================================
   ATMOSPHÈRE GÉNÉRALE
   ========================================================= */

.atmosphere {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 2;

    background:
        radial-gradient(
            ellipse at 50% 43%,
            rgba(255, 190, 100, 0.15) 0%,
            rgba(255, 145, 55, 0.08) 28%,
            transparent 68%
        );

    mix-blend-mode: screen;

    animation: atmospherePulse 6s ease-in-out infinite;
}

/* =========================================================
   HALO CENTRAL
   ========================================================= */

.glow {
    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 850px;
    max-height: 850px;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;
    z-index: 3;

    background:
        radial-gradient(
            circle,
            rgba(255, 190, 85, 0.18) 0%,
            rgba(255, 150, 50, 0.10) 28%,
            rgba(255, 120, 30, 0.04) 48%,
            transparent 75%
        );

    mix-blend-mode: screen;

    animation: glowMove 8s ease-in-out infinite;
}

/* =========================================================
   HALO DU SOLEIL
   ========================================================= */

.sun-glow {
    position: absolute;

    width: 280px;
    height: 280px;

    right: 8%;
    top: 42%;

    transform: translate(50%, -50%);

    border-radius: 50%;

    pointer-events: none;
    z-index: 4;

    background:
        radial-gradient(
            circle,
            rgba(255, 245, 190, 0.28) 0%,
            rgba(255, 190, 75, 0.20) 18%,
            rgba(255, 135, 35, 0.10) 38%,
            transparent 72%
        );

    mix-blend-mode: screen;

    filter: blur(4px);

    animation: sunPulse 5s ease-in-out infinite;
}

/* =========================================================
   VIGNETTE
   ========================================================= */

.vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 15;

    background:
        radial-gradient(
            ellipse at center,
            transparent 45%,
            rgba(0, 0, 0, 0.08) 70%,
            rgba(0, 0, 0, 0.40) 100%
        );
}

/* =========================================================
   REFLETS SUR LA MER
   ========================================================= */

.sea-shimmer {
    position: absolute;

    left: -15%;
    bottom: 0;

    width: 130%;
    height: 48%;

    pointer-events: none;
    z-index: 6;

    background:
        repeating-linear-gradient(
            168deg,
            transparent 0%,
            transparent 5%,
            rgba(255, 230, 170, 0.10) 7%,
            rgba(255, 210, 130, 0.22) 8%,
            rgba(255, 235, 180, 0.08) 10%,
            transparent 14%
        );

    opacity: 0.72;

    mix-blend-mode: screen;

    animation: seaShimmer 6s ease-in-out infinite;
}

/* second layer de reflets */

.sea-reflections {
    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 40%;

    pointer-events: none;
    z-index: 7;

    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255, 180, 70, 0.03) 25%,
            rgba(255, 205, 120, 0.16) 48%,
            rgba(255, 175, 65, 0.10) 62%,
            transparent 100%
        );

    mix-blend-mode: screen;

    animation: reflectionMove 7s ease-in-out infinite;
}

/* =========================================================
   LIGNE LUMINEUSE SUR L'HORIZON
   ========================================================= */

.horizon-light {
    position: absolute;

    left: 12%;
    right: 12%;
    top: 67%;

    height: 3px;

    pointer-events: none;
    z-index: 8;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 205, 120, 0.12),
            rgba(255, 230, 170, 0.45),
            rgba(255, 190, 80, 0.18),
            transparent
        );

    filter: blur(2px);

    mix-blend-mode: screen;

    animation: horizonPulse 5s ease-in-out infinite;
}

/* =========================================================
   ÉCLAIRS
   ========================================================= */

.lightning {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 12;

    opacity: 0;

    background:
        linear-gradient(
            105deg,
            transparent 0%,
            transparent 43%,
            rgba(255,255,255,0.08) 46%,
            rgba(255,255,255,0.75) 49%,
            rgba(255,255,255,0.25) 51%,
            transparent 54%,
            transparent 100%
        );

    mix-blend-mode: screen;

    animation: powerfulLightning 11s infinite;
}

/* second éclair */

.lightning::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            78deg,
            transparent 0%,
            transparent 57%,
            rgba(255,255,255,0.10) 60%,
            rgba(255,255,255,0.80) 63%,
            rgba(255,255,255,0.20) 65%,
            transparent 68%,
            transparent 100%
        );

    opacity: 0;

    animation: secondLightning 17s infinite;
}

/* troisième éclair */

.lightning::after {
    content: "";

    position: absolute;

    top: 3%;
    left: 59%;

    width: 5px;
    height: 48%;

    background:
        linear-gradient(
            180deg,
            transparent,
            rgba(255,255,255,0.95) 25%,
            rgba(255,255,255,0.65) 55%,
            transparent
        );

    transform:
        rotate(7deg)
        skewX(-15deg);

    filter: blur(1px);

    opacity: 0;

    animation: verticalLightning 23s infinite;
}

/* =========================================================
   OISEAUX
   ========================================================= */

.birds {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 9;
}

.bird {
    position: absolute;

    width: 34px;
    height: 16px;

    opacity: 0;

    animation: birdFlight 18s linear infinite;
}

/* forme simple d'oiseau */

.bird::before,
.bird::after {
    content: "";

    position: absolute;

    top: 7px;

    width: 18px;
    height: 7px;

    border-top: 3px solid rgba(15, 15, 15, 0.88);

    border-radius: 80% 80% 0 0;
}

.bird::before {
    right: 16px;

    transform:
        rotate(18deg)
        skewX(-15deg);
}

.bird::after {
    left: 16px;

    transform:
        rotate(-18deg)
        skewX(15deg);
}

.bird:nth-child(1) {
    top: 20%;
    left: -5%;

    transform: scale(0.8);

    animation-delay: 1s;
    animation-duration: 20s;
}

.bird:nth-child(2) {
    top: 27%;
    left: -8%;

    transform: scale(1.15);

    animation-delay: 7s;
    animation-duration: 24s;
}

.bird:nth-child(3) {
    top: 15%;
    left: -12%;

    transform: scale(0.55);

    animation-delay: 12s;
    animation-duration: 22s;
}

.bird:nth-child(4) {
    top: 31%;
    left: -10%;

    transform: scale(0.7);

    animation-delay: 17s;
    animation-duration: 26s;
}

/* =========================================================
   LUEUR DORÉE MOBILE
   ========================================================= */

.gold-sweep {
    position: absolute;

    top: 31%;
    left: -25%;

    width: 22%;
    height: 34%;

    pointer-events: none;
    z-index: 11;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 205, 105, 0.05),
            rgba(255, 220, 135, 0.26),
            rgba(255, 245, 190, 0.12),
            transparent
        );

    filter: blur(10px);

    mix-blend-mode: screen;

    transform: skewX(-12deg);

    animation: goldSweep 9s ease-in-out infinite;
}

/* =========================================================
   LUEUR ATMOSPHÉRIQUE SUPPLÉMENTAIRE
   ========================================================= */

.ambient-glow {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 10;

    background:
        radial-gradient(
            ellipse at 50% 48%,
            rgba(255, 150, 45, 0.07),
            transparent 58%
        );

    mix-blend-mode: screen;

    animation: ambientPulse 5s ease-in-out infinite;
}

/* =========================================================
   BOUTON MUSIQUE
   ========================================================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    z-index: 30;

    padding: 10px 17px;

    border: 1px solid rgba(235, 205, 145, 0.75);
    border-radius: 22px;

    background: rgba(10, 10, 10, 0.65);

    color: #f3e5c4;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease,
        box-shadow 0.3s ease;
}

.music-button:hover {
    background: rgba(45, 30, 15, 0.82);

    color: #fff4d8;

    border-color: rgba(255, 220, 155, 0.95);

    box-shadow:
        0 0 18px rgba(255, 170, 70, 0.18);

    transform: translateY(-1px);
}

.music-button.active {
    background: rgba(70, 42, 18, 0.78);

    color: #ffe9bd;

    border-color: rgba(255, 190, 90, 0.95);

    box-shadow:
        0 0 20px rgba(255, 170, 65, 0.28);
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes imageBreathing {

    0%, 100% {
        filter:
            brightness(0.96)
            saturate(1.02)
            contrast(1.02);
    }

    50% {
        filter:
            brightness(1.04)
            saturate(1.08)
            contrast(1.05);
    }
}

@keyframes atmospherePulse {

    0%, 100% {
        opacity: 0.45;
        transform: scale(0.98);
    }

    50% {
        opacity: 0.95;
        transform: scale(1.03);
    }
}

@keyframes glowMove {

    0%, 100% {
        opacity: 0.45;
        transform: translate(-50%, -50%) scale(0.94);
    }

    50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.08);
    }
}

@keyframes sunPulse {

    0%, 100% {
        opacity: 0.55;
        transform: translate(50%, -50%) scale(0.88);
    }

    50% {
        opacity: 1;
        transform: translate(50%, -50%) scale(1.14);
    }
}

@keyframes seaShimmer {

    0%, 100% {
        transform: translateX(-4%) scaleY(0.98);
        opacity: 0.45;
    }

    50% {
        transform: translateX(4%) scaleY(1.05);
        opacity: 1;
    }
}

@keyframes reflectionMove {

    0%, 100% {
        transform: translateX(-2%);
        opacity: 0.35;
    }

    50% {
        transform: translateX(3%);
        opacity: 0.9;
    }
}

@keyframes horizonPulse {

    0%, 100% {
        opacity: 0.25;
        transform: scaleX(0.88);
    }

    50% {
        opacity: 1;
        transform: scaleX(1.04);
    }
}

/* =========================================================
   ÉCLAIRS PUISSANTS
   ========================================================= */

@keyframes powerfulLightning {

    0%, 67%, 100% {
        opacity: 0;
    }

    68% {
        opacity: 0.95;
    }

    68.8% {
        opacity: 0.15;
    }

    69.4% {
        opacity: 0.85;
    }

    70.2% {
        opacity: 0.05;
    }

    71% {
        opacity: 0.65;
    }

    72.5% {
        opacity: 0;
    }
}

@keyframes secondLightning {

    0%, 51%, 100% {
        opacity: 0;
    }

    52% {
        opacity: 0.75;
    }

    53.2% {
        opacity: 0.12;
    }

    54% {
        opacity: 0.9;
    }

    55.5% {
        opacity: 0;
    }
}

@keyframes verticalLightning {

    0%, 78%, 100% {
        opacity: 0;
    }

    79% {
        opacity: 0.9;
    }

    80% {
        opacity: 0.15;
    }

    81% {
        opacity: 0.75;
    }

    82.5% {
        opacity: 0;
    }
}

/* =========================================================
   OISEAUX
   ========================================================= */

@keyframes birdFlight {

    0% {
        left: -12%;
        opacity: 0;
        transform: translateY(0) scale(1);
    }

    8% {
        opacity: 0.8;
    }

    45% {
        opacity: 0.85;
    }

    85% {
        opacity: 0.7;
    }

    100% {
        left: 110%;
        opacity: 0;
        transform: translateY(-35px) scale(1);
    }
}

/* =========================================================
   LUEUR DORÉE
   ========================================================= */

@keyframes goldSweep {

    0%, 15% {
        left: -25%;
        opacity: 0;
    }

    25% {
        opacity: 0.3;
    }

    50% {
        left: 48%;
        opacity: 0.85;
    }

    65% {
        opacity: 0.25;
    }

    80%, 100% {
        left: 115%;
        opacity: 0;
    }
}

@keyframes ambientPulse {

    0%, 100% {
        opacity: 0.35;
    }

    50% {
        opacity: 0.9;
    }
}

/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media (max-width: 700px) {

    .music-button {
        right: 12px;
        bottom: 12px;

        padding: 9px 14px;

        font-size: 14px;
    }

    .sun-glow {
        width: 180px;
        height: 180px;
    }

    .bird {
        transform: scale(0.7);
    }
}

</style>
</head>


<body>

<div class="scene">

    <!-- IMAGE ORIGINALE : AUCUN CHANGEMENT -->
    <div class="background">
        <img src="visuel.jpg" alt="Mad.BZH">
    </div>

    <!-- ATMOSPHÈRE -->
    <div class="atmosphere"></div>
    <div class="glow"></div>
    <div class="sun-glow"></div>
    <div class="ambient-glow"></div>

    <!-- MER -->
    <div class="sea-shimmer"></div>
    <div class="sea-reflections"></div>
    <div class="horizon-light"></div>

    <!-- ÉCLAIRS -->
    <div class="lightning"></div>

    <!-- OISEAUX -->
    <div class="birds">

        <div class="bird"></div>
        <div class="bird"></div>
        <div class="bird"></div>
        <div class="bird"></div>

    </div>

    <!-- LUEUR DORÉE -->
    <div class="gold-sweep"></div>

    <!-- VIGNETTE -->
    <div class="vignette"></div>

    <!-- MUSIQUE -->
    <audio id="music" preload="auto" loop>
        <source src="celtic-ambience.wav" type="audio/wav">
    </audio>

    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Activer ou arrêter la musique"
    >
        ♫ Musique
    </button>

</div>


<script>

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {

            await music.play();

            musicButton.textContent = "♫ Musique ON";
            musicButton.classList.add("active");

        } catch (error) {

            console.log("Lecture audio impossible :", error);

        }

    } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("active");

    }

});

</script>

</body>
</html>
