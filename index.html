<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mad.bzh</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

.scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

/* =========================
   IMAGE
   ========================= */

.background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #05070a;
}

.background img {
    display: block;
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center 42%;

    user-select: none;
    -webkit-user-drag: none;

    animation: imageBreathing 12s ease-in-out infinite;
}

/* =========================
   LUEUR CENTRALE
   ========================= */

.atmosphere {
    position: absolute;
    inset: 0;
    z-index: 2;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 43%,
            rgba(255, 190, 100, 0.15),
            rgba(255, 145, 55, 0.06) 30%,
            transparent 65%
        );

    mix-blend-mode: screen;

    animation: atmospherePulse 6s ease-in-out infinite;
}

.glow {
    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 800px;
    max-height: 800px;

    left: 50%;
    top: 47%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;
    z-index: 3;

    background:
        radial-gradient(
            circle,
            rgba(255, 190, 90, 0.15) 0%,
            rgba(255, 130, 45, 0.055) 35%,
            transparent 70%
        );

    mix-blend-mode: screen;

    animation: glowMove 8s ease-in-out infinite;
}

/* =========================
   MOUVEMENT DE LA MER
   ========================= */

.sea-shimmer {
    position: absolute;

    left: -20%;
    bottom: -5%;

    width: 140%;
    height: 48%;

    z-index: 4;
    pointer-events: none;

    background:
        repeating-linear-gradient(
            170deg,
            transparent 0%,
            transparent 5%,
            rgba(255, 225, 165, 0.035) 7%,
            rgba(255, 225, 165, 0.16) 9%,
            rgba(255, 210, 135, 0.045) 11%,
            transparent 14%
        );

    mix-blend-mode: screen;

    opacity: 0.7;

    animation:
        seaMove 6s ease-in-out infinite,
        seaBrightness 4s ease-in-out infinite;
}

/* Grand reflet qui traverse lentement la mer */

.sea-shimmer::before {
    content: "";

    position: absolute;
    inset: -20%;

    background:
        linear-gradient(
            105deg,
            transparent 20%,
            rgba(255, 225, 170, 0.02) 35%,
            rgba(255, 230, 180, 0.22) 48%,
            rgba(255, 220, 150, 0.05) 55%,
            transparent 70%
        );

    mix-blend-mode: screen;

    animation: seaSweep 8s ease-in-out infinite;
}

/* Ligne lumineuse de l'horizon */

.sea-shimmer::after {
    content: "";

    position: absolute;

    left: 8%;
    right: 8%;
    top: 35%;

    height: 4px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 220, 150, 0.55),
            rgba(255, 240, 195, 0.22),
            transparent
        );

    filter: blur(2px);

    animation: horizonPulse 4s ease-in-out infinite;
}

/* =========================
   LUEUR AMBIANTE
   ========================= */

.ambient-glow {
    position: absolute;
    inset: 0;

    z-index: 5;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(255, 180, 75, 0.06),
            transparent 60%
        );

    mix-blend-mode: screen;

    animation: ambientPulse 7s ease-in-out infinite;
}

/* =========================
   ÉCLAIRS
   ========================= */

.lightning {
    position: absolute;
    inset: 0;

    z-index: 7;

    pointer-events: none;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at 72% 25%,
            rgba(255,255,255,0.34),
            rgba(215,230,255,0.12) 18%,
            transparent 45%
        );

    mix-blend-mode: screen;

    animation: stormFlash 9s infinite;
}

/* Premier éclair */

.lightning::before {
    content: "";

    position: absolute;

    top: 7%;
    right: 27%;

    width: 5px;
    height: 36%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(255,255,255,0.95) 15%,
            rgba(225,240,255,0.85) 40%,
            rgba(255,255,255,0.45) 65%,
            transparent
        );

    clip-path: polygon(
        45% 0%,
        70% 0%,
        54% 32%,
        82% 32%,
        28% 70%,
        43% 43%,
        18% 43%
    );

    filter: blur(0.5px);

    animation: boltFlash 9s infinite;
}

/* Deuxième éclair */

.lightning::after {
    content: "";

    position: absolute;

    top: 13%;
    left: 24%;

    width: 3px;
    height: 25%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(235,245,255,0.7),
            transparent
        );

    transform: rotate(-8deg);

    filter: blur(1px);

    animation: secondBolt 13s infinite;
}

/* =========================
   VIGNETTE
   ========================= */

.vignette {
    position: absolute;
    inset: 0;

    z-index: 8;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0,0,0,0.08) 72%,
            rgba(0,0,0,0.38) 100%
        );
}

/* =========================
   BOUTON MUSIQUE
   ========================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    z-index: 20;

    padding: 10px 17px;

    border: 1px solid rgba(235,205,145,0.75);
    border-radius: 22px;

    background: rgba(10,10,10,0.65);

    color: #f3e5c4;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease,
        box-shadow 0.3s ease;
}

.music-button:hover {
    background: rgba(45,30,15,0.82);
    color: #fff4d8;
    border-color: rgba(255,220,155,0.95);

    box-shadow:
        0 0 18px rgba(255,170,70,0.18);

    transform: translateY(-1px);
}

.music-button.active {
    background: rgba(70,42,18,0.78);
    color: #ffe9bd;
    border-color: rgba(255,190,90,0.95);

    box-shadow:
        0 0 20px rgba(255,170,65,0.28);
}

/* =========================
   ANIMATIONS
   ========================= */

@keyframes imageBreathing {

    0%, 100% {
        filter:
            brightness(0.96)
            saturate(1.02)
            contrast(1.02);
    }

    50% {
        filter:
            brightness(1.03)
            saturate(1.07)
            contrast(1.04);
    }
}

@keyframes atmospherePulse {

    0%, 100% {
        opacity: 0.35;
        transform: scale(0.97);
    }

    50% {
        opacity: 0.9;
        transform: scale(1.04);
    }
}

@keyframes glowMove {

    0%, 100% {
        opacity: 0.3;
        transform: translate(-50%,-50%) scale(0.94);
    }

    50% {
        opacity: 0.9;
        transform: translate(-48%,-52%) scale(1.08);
    }
}

@keyframes ambientPulse {

    0%, 100% {
        opacity: 0.25;
    }

    50% {
        opacity: 0.85;
    }
}

/* Mer */

@keyframes seaMove {

    0% {
        transform: translateX(-5%) translateY(1%);
    }

    50% {
        transform: translateX(5%) translateY(-1%);
    }

    100% {
        transform: translateX(-5%) translateY(1%);
    }
}

@keyframes seaBrightness {

    0%, 100% {
        opacity: 0.35;
    }

    50% {
        opacity: 0.85;
    }
}

@keyframes seaSweep {

    0% {
        transform: translateX(-25%);
        opacity: 0.1;
    }

    50% {
        transform: translateX(25%);
        opacity: 0.8;
    }

    100% {
        transform: translateX(-25%);
        opacity: 0.1;
    }
}

@keyframes horizonPulse {

    0%, 100% {
        opacity: 0.2;
        transform: scaleX(0.75);
    }

    50% {
        opacity: 0.9;
        transform: scaleX(1.05);
    }
}

/* Éclairs */

@keyframes stormFlash {

    0%, 35%, 100% {
        opacity: 0;
    }

    36% {
        opacity: 0.18;
    }

    36.3% {
        opacity: 0;
    }

    36.7% {
        opacity: 0.08;
    }

    37% {
        opacity: 0;
    }
}

@keyframes boltFlash {

    0%, 35%, 100% {
        opacity: 0;
    }

    36% {
        opacity: 0.95;
    }

    36.25% {
        opacity: 0;
    }

    36.7% {
        opacity: 0.65;
    }

    37% {
        opacity: 0;
    }
}

@keyframes secondBolt {

    0%, 40%, 100% {
        opacity: 0;
    }

    41% {
        opacity: 0.75;
    }

    41.3% {
        opacity: 0;
    }
}

/* =========================
   PETITS ÉCRANS
   ========================= */

@media (max-width: 700px) {

    .music-button {
        right: 12px;
        bottom: 12px;

        padding: 9px 14px;

        font-size: 14px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <div class="background">
        <img src="visuel.jpg" alt="Mad.BZH">
    </div>

    <div class="atmosphere"></div>
    <div class="glow"></div>
    <div class="sea-shimmer"></div>
    <div class="ambient-glow"></div>
    <div class="lightning"></div>
    <div class="vignette"></div>

    <audio id="music" preload="auto" loop>
        <source src="celtic-ambience.wav" type="audio/wav">
    </audio>

    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Activer ou arrêter la musique"
    >
        ♫ Musique
    </button>

</div>

<script>

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {

            await music.play();

            musicButton.textContent = "♫ Musique ON";
            musicButton.classList.add("active");

        } catch (error) {

            console.log("Lecture audio impossible :", error);

        }

    } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("active");

    }

});
