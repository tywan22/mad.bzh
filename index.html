<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mad.bzh</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

/* =========================================================
   SCÈNE
   ========================================================= */

.scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
}

/* =========================================================
   IMAGE PRINCIPALE
   ========================================================= */

.background {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    background: #05070a;
}

.background img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center 42%;

    user-select: none;
    -webkit-user-drag: none;

    animation: imageBreathing 12s ease-in-out infinite;
}

/* =========================================================
   LUEUR ATMOSPHÉRIQUE
   ========================================================= */

.atmosphere {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 2;

    background:
        radial-gradient(
            ellipse at 50% 43%,
            rgba(255, 190, 100, 0.16) 0%,
            rgba(255, 145, 55, 0.08) 25%,
            transparent 62%
        );

    mix-blend-mode: screen;

    animation: atmospherePulse 7s ease-in-out infinite;
}

/* =========================================================
   GRANDE LUEUR CENTRALE
   ========================================================= */

.glow {
    position: absolute;

    width: 55vw;
    height: 55vw;

    max-width: 800px;
    max-height: 800px;

    left: 50%;
    top: 47%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    pointer-events: none;
    z-index: 3;

    background:
        radial-gradient(
            circle,
            rgba(255, 190, 90, 0.16) 0%,
            rgba(255, 130, 45, 0.07) 32%,
            transparent 70%
        );

    mix-blend-mode: screen;

    animation: glowMove 9s ease-in-out infinite;
}

/* =========================================================
   VIGNETTE
   ========================================================= */

.vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 8;

    background:
        radial-gradient(
            ellipse at center,
            transparent 48%,
            rgba(0, 0, 0, 0.08) 72%,
            rgba(0, 0, 0, 0.38) 100%
        );
}

/* =========================================================
   MOUVEMENT LUMINEUX SUR LA MER
   ========================================================= */

.sea-shimmer {
    position: absolute;

    left: -15%;
    bottom: -5%;

    width: 130%;
    height: 48%;

    pointer-events: none;
    z-index: 4;

    background:
        repeating-linear-gradient(
            168deg,
            transparent 0%,
            transparent 7%,
            rgba(255, 220, 150, 0.02) 9%,
            rgba(255, 225, 165, 0.13) 11%,
            rgba(255, 210, 135, 0.035) 13%,
            transparent 17%
        );

    opacity: 0.55;

    mix-blend-mode: screen;

    filter: blur(0.5px);

    animation: seaShimmer 7s ease-in-out infinite;
}

.sea-shimmer::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            175deg,
            transparent 0%,
            transparent 35%,
            rgba(255, 215, 140, 0.10) 48%,
            transparent 60%
        );

    opacity: 0.75;

    animation: seaLightSweep 11s ease-in-out infinite;
}

.sea-shimmer::after {
    content: "";

    position: absolute;

    left: 12%;
    right: 12%;
    top: 40%;

    height: 3px;

    border-radius: 50%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255, 220, 150, 0.45),
            rgba(255, 235, 190, 0.18),
            transparent
        );

    filter: blur(2px);

    opacity: 0.45;

    animation: horizonGlow 5s ease-in-out infinite;
}

/* =========================================================
   LUEUR AMBIANTE SUPPLÉMENTAIRE
   ========================================================= */

.ambient-glow {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 6;

    background:
        radial-gradient(
            ellipse at 52% 48%,
            rgba(255, 175, 75, 0.055),
            transparent 58%
        );

    mix-blend-mode: screen;

    animation: ambientPulse 8s ease-in-out infinite;
}

/* =========================================================
   ÉCLAIRS
   ========================================================= */

.lightning {
    position: absolute;
    inset: 0;

    pointer-events: none;
    z-index: 7;

    opacity: 0;

    background:
        radial-gradient(
            ellipse at 68% 28%,
            rgba(255, 255, 255, 0.24),
            rgba(210, 225, 255, 0.10) 18%,
            transparent 45%
        );

    mix-blend-mode: screen;

    animation: distantLightning 11s infinite;
}

/* Trait lumineux d'éclair */

.lightning::before {
    content: "";

    position: absolute;

    top: 7%;
    right: 28%;

    width: 3px;
    height: 34%;

    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(235,245,255,0.9) 18%,
            rgba(255,255,255,0.65) 42%,
            rgba(220,235,255,0.25) 70%,
            transparent
        );

    clip-path: polygon(
        45% 0%,
        65% 0%,
        52% 35%,
        78% 35%,
        28% 72%,
        40% 42%,
        20% 42%
    );

    filter: blur(0.7px);

    opacity: 0;

    animation: lightningFlash 11s infinite;
}

/* Deuxième éclair plus lointain */

.lightning::after {
    content: "";

    position: absolute;

    top: 12%;
    left: 23%;

    width: 2px;
    height: 24%;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(230,240,255,0.55),
            transparent
        );

    transform: rotate(-7deg);

    filter: blur(1px);

    opacity: 0;

    animation: lightningFlashSecond 17s infinite;
}

/* =========================================================
   BOUTON MUSIQUE
   ========================================================= */

.music-button {
    position: absolute;

    right: 18px;
    bottom: 18px;

    z-index: 20;

    padding: 10px 17px;

    border: 1px solid rgba(235, 205, 145, 0.75);
    border-radius: 22px;

    background: rgba(10, 10, 10, 0.65);

    color: #f3e5c4;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);

    transition:
        background 0.3s ease,
        color 0.3s ease,
        border-color 0.3s ease,
        transform 0.2s ease,
        box-shadow 0.3s ease;
}

.music-button:hover {
    background: rgba(45, 30, 15, 0.82);

    color: #fff4d8;

    border-color: rgba(255, 220, 155, 0.95);

    box-shadow:
        0 0 18px rgba(255, 170, 70, 0.18);

    transform: translateY(-1px);
}

.music-button.active {
    background: rgba(70, 42, 18, 0.78);

    color: #ffe9bd;

    border-color: rgba(255, 190, 90, 0.95);

    box-shadow:
        0 0 20px rgba(255, 170, 65, 0.28);
}

/* =========================================================
   ANIMATIONS
   ========================================================= */

@keyframes imageBreathing {

    0%, 100% {
        filter:
            brightness(0.96)
            saturate(1.02)
            contrast(1.02);
    }

    50% {
        filter:
            brightness(1.03)
            saturate(1.07)
            contrast(1.04);
    }
}

@keyframes atmospherePulse {

    0%, 100% {
        opacity: 0.45;
        transform: scale(0.97);
    }

    50% {
        opacity: 0.90;
        transform: scale(1.04);
    }
}

@keyframes glowMove {

    0%, 100% {
        opacity: 0.35;
        transform: translate(-50%, -50%) scale(0.94);
    }

    50% {
        opacity: 0.85;
        transform: translate(-48%, -52%) scale(1.08);
    }
}

@keyframes ambientPulse {

    0%, 100% {
        opacity: 0.35;
    }

    50% {
        opacity: 0.95;
    }
}

@keyframes seaShimmer {

    0% {
        transform: translateX(-7%);
        opacity: 0.30;
    }

    50% {
        transform: translateX(7%);
        opacity: 0.80;
    }

    100% {
        transform: translateX(-7%);
        opacity: 0.30;
    }
}

@keyframes seaLightSweep {

    0%, 100% {
        transform: translateX(-8%);
        opacity: 0.20;
    }

    50% {
        transform: translateX(8%);
        opacity: 0.75;
    }
}

@keyframes horizonGlow {

    0%, 100% {
        opacity: 0.20;
        transform: scaleX(0.75);
    }

    50% {
        opacity: 0.90;
        transform: scaleX(1.05);
    }
}

/* =========================================================
   ÉCLAIRS : flashes courts
   ========================================================= */

@keyframes distantLightning {

    0%, 72%, 100% {
        opacity: 0;
    }

    73% {
        opacity: 0.25;
    }

    73.5% {
        opacity: 0;
    }

    74% {
        opacity: 0.12;
    }

    74.4% {
        opacity: 0;
    }
}

@keyframes lightningFlash {

    0%, 72%, 100% {
        opacity: 0;
    }

    73% {
        opacity: 0.95;
    }

    73.35% {
        opacity: 0;
    }

    73.8% {
        opacity: 0.60;
    }

    74.15% {
        opacity: 0;
    }
}

@keyframes lightningFlashSecond {

    0%, 76%, 100% {
        opacity: 0;
    }

    77% {
        opacity: 0.65;
    }

    77.4% {
        opacity: 0;
    }
}

/* =========================================================
   PETITS ÉCRANS
   ========================================================= */

@media (max-width: 700px) {

    .music-button {
        right: 12px;
        bottom: 12px;

        padding: 9px 14px;

        font-size: 14px;
    }
}

</style>
</head>

<body>

<div class="scene">

    <!-- IMAGE PRINCIPALE -->
    <div class="background">
        <img src="visuel.jpg" alt="Mad.BZH">
    </div>

    <!-- EFFETS VISUELS -->
    <div class="atmosphere"></div>
    <div class="glow"></div>
    <div class="sea-shimmer"></div>
    <div class="ambient-glow"></div>
    <div class="lightning"></div>
    <div class="vignette"></div>

    <!-- MUSIQUE -->
    <audio id="music" preload="auto" loop>
        <source src="celtic-ambience.wav" type="audio/wav">
    </audio>

    <button
        id="musicButton"
        class="music-button"
        type="button"
        aria-label="Activer ou arrêter la musique"
    >
        ♫ Musique
    </button>

</div>

<script>

const music = document.getElementById("music");
const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {

    if (music.paused) {

        try {

            await music.play();

            musicButton.textContent = "♫ Musique ON";
            musicButton.classList.add("active");

        } catch (error) {

            console.log("Lecture audio impossible :", error);

        }

    } else {

        music.pause();

        musicButton.textContent = "♫ Musique";
        musicButton.classList.remove("active");

    }

});

</script>

</body>
</html>
